    /* =========================================================================
       EXPLORER SCALE ENGINE (1km -> 5000km)
       ========================================================================= */
    const ExplorerScaleEngine = (() => {
      function getScaleConfig(scaleKm) {
        const s = Number(scaleKm) || 25;
        let zoom = 11;
        let poiLimit = 250;
        let routeDensity = 'detailed';
        let aiContext = 'Local exploration within ' + s + 'km';

        if (s <= 1) { zoom = 15; poiLimit = 120; routeDensity = 'hyper-local footpaths & stops'; aiContext = 'Ultra-local 1km radius: immediate walk/stop spots'; }
        else if (s <= 5) { zoom = 13; poiLimit = 180; routeDensity = 'neighbourhood & trail detail'; aiContext = 'Local 5km radius: nearby highlights, cafés & viewpoints'; }
        else if (s <= 10) { zoom = 12; poiLimit = 240; routeDensity = 'town & valley scale'; aiContext = '10km area: day walk/cycle loops & local gems'; }
        else if (s <= 25) { zoom = 11; poiLimit = 350; routeDensity = 'regional touring scale'; aiContext = '25km region: scenic drives, stops & viewpoints'; }
        else if (s <= 50) { zoom = 10; poiLimit = 450; routeDensity = 'cross-country corridor'; aiContext = '50km corridor: multi-stop day trip & motorhome stops'; }
        else if (s <= 100) { zoom = 9; poiLimit = 600; routeDensity = 'province / park scale'; aiContext = '100km zone: national parks, scenic routes & overnight spots'; }
        else if (s <= 250) { zoom = 8; poiLimit = 800; routeDensity = 'multi-day touring leg'; aiContext = '250km leg: major hubs, scenic corridors & weather zones'; }
        else if (s <= 500) { zoom = 7; poiLimit = 1000; routeDensity = 'grand tour segment'; aiContext = '500km segment: regional highlights & route staging'; }
        else if (s <= 1000) { zoom = 6; poiLimit = 1200; routeDensity = 'national / cross-border tour'; aiContext = '1000km tour: major corridors, parks & staging stops'; }
        else if (s <= 2500) { zoom = 5; poiLimit = 1500; routeDensity = 'continental expedition'; aiContext = '2500km expedition: broad regional corridors & climate shifts'; }
        else { zoom = 4; poiLimit = 1800; routeDensity = 'sub-continental overview'; aiContext = '5000km overview: high-level macro route & regional themes'; }

        return {
          scaleKm: s,
          queryRadiusMeters: s * 1000,
          zoom,
          poiLimit,
          routeDensity,
          aiContext
        };
      }

      function applyScale(scaleKm, syncMapZoom = true) {
        const cfg = getScaleConfig(scaleKm);
        AppState.update({ explorerScaleKm: cfg.scaleKm }, 'scale:changed');
        AppState.persistPreferences();
        const selectEl = document.getElementById('hudScaleSelect');
        if (selectEl && String(selectEl.value) !== String(cfg.scaleKm)) {
          selectEl.value = String(cfg.scaleKm);
        }
        if (syncMapZoom && MapEngine.isReady()) {
          MapEngine.setZoom(cfg.zoom);
        }
        return cfg;
      }

      return { getScaleConfig, applyScale };
    })();

    /* =========================================================================
       MULTILINGUAL ENGINE (MAX 3 LANGUAGES: PREFERRED, ENGLISH, NATIVE)
       ========================================================================= */
    const MultilingualEngine = (() => {
      function detectLanguagesFromBounds(bounds) {
        const detected = ['en'];
        if (!bounds) return detected.slice(0, 3);
        const south = bounds.getSouth();
        const north = bounds.getNorth();
        const west = bounds.getWest();
        const east = bounds.getEast();

        // Scotland / Gaelic / Scots signal
        if (north >= 54.5 && south <= 61 && west <= -1 && east >= -8) {
          detected.push('gd');
        }
        // Western / Central Europe signals
        if (east > -5 && west < 25 && north > 35 && south < 60) {
          if (west < 5 && east > -5) detected.push('fr');
          if (west < 16 && east > 5 && north > 45) detected.push('de');
          if (west < 19 && east > 6 && north < 48 && south > 36) detected.push('it');
          if (west < 4 && east > -10 && north < 44 && south > 35) detected.push('es');
        }
        return Array.from(new Set(detected)).slice(0, 3);
      }

      function formatPlaceName(tags = {}, fallbackName = 'Unnamed Place') {
        const state = AppState.getState();
        const pref = state.selectedLanguages.preferred || 'en';
        const nativeName = tags.name || fallbackName;
        const enName = tags['name:en'] || nativeName;
        const prefName = tags[`name:${pref}`] || (pref === 'en' ? enName : nativeName);

        const ordered = [];
        const pushUnique = (val) => {
          const clean = GeoUtils.sanitizeText(val, 140);
          if (clean && !ordered.some((x) => x.toLowerCase() === clean.toLowerCase())) {
            ordered.push(clean);
          }
        };

        pushUnique(prefName);
        pushUnique(enName);
        pushUnique(nativeName);

        const topThree = ordered.slice(0, 3);
        return {
          primary: topThree[0] || fallbackName,
          secondary: topThree.slice(1),
          all: topThree
        };
      }

      function formatPlaceHtml(tags = {}, fallbackName = 'Unnamed Place') {
        const parts = formatPlaceName(tags, fallbackName);
        const secHtml = parts.secondary.length
          ? `<span class="lang-secondary">${GeoUtils.escapeHtml(parts.secondary.join(' · '))}</span>`
          : '';
        return `<div class="lang-stack"><span class="lang-primary">${GeoUtils.escapeHtml(parts.primary)}</span>${secHtml}</div>`;
      }

      return { detectLanguagesFromBounds, formatPlaceName, formatPlaceHtml };
    })();

    /* =========================================================================
       MAP ENGINE (LEAFLET + MARKERCLUSTER + LAYER GROUPS + ESRI SATELLITE)
       ========================================================================= */
    const MapEngine = (() => {
      let map = null;
      let baseLayers = {};
      let activeBaseLayer = null;
      let overlayGroups = {};
      let poiClusterGroup = null;
      let routeLayerGroup = null;
      let gpxLayerGroup = null;
      let userMarker = null;
      let userAccuracyCircle = null;

      function init(containerId = 'map') {
        if (map) return map;
        const state = AppState.getState();
        map = L.map(containerId, {
          center: state.mapView.center,
          zoom: state.mapView.zoom,
          zoomControl: true,
          preferCanvas: true
        });

        const osmLayer = L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
          maxZoom: 19,
          attribution: '© <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors'
        });

        const terrainLayer = L.tileLayer('https://{s}.tile.opentopomap.org/{z}/{x}/{y}.png', {
          maxZoom: 17,
          attribution: 'Map data: © <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a>, SRTM | Style: © <a href="https://opentopomap.org">OpenTopoMap</a>'
        });

        const satelliteLayer = L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', {
          maxZoom: 19,
          attribution: 'Tiles © Esri — Source: Esri, i-cubed, USDA, USGS, AEX, GeoEye, Getmapping, Aerogrid, IGN, IGP, UPR-EGP, and the GIS User Community'
        });

        baseLayers = {
          osm: osmLayer,
          terrain: terrainLayer,
          satellite: satelliteLayer
        };

        activeBaseLayer = osmLayer;
        activeBaseLayer.addTo(map);

        overlayGroups = {
          walking: L.layerGroup().addTo(map),
          cycling: L.layerGroup().addTo(map),
          mtb: L.layerGroup(),
          horse: L.layerGroup(),
          motorhome: L.layerGroup().addTo(map),
          parks: L.layerGroup().addTo(map),
          scenic: L.layerGroup().addTo(map)
        };

        poiClusterGroup = L.markerClusterGroup({
          chunkedLoading: true,
          maxClusterRadius: 48,
          spiderfyOnMaxZoom: true,
          disableClusteringAtZoom: 17
        });
        map.addLayer(poiClusterGroup);

        routeLayerGroup = L.layerGroup().addTo(map);
        gpxLayerGroup = L.layerGroup().addTo(map);

        populateReferenceOverlays();
        syncLayersFromState();

        map.on('moveend zoomend', GeoUtils.debounce(() => {
          const c = map.getCenter();
          const z = map.getZoom();
          AppState.update({ mapView: { center: [c.lat, c.lng], zoom: z } }, 'map:moved');
          const detected = MultilingualEngine.detectLanguagesFromBounds(map.getBounds());
          const st = AppState.getState();
          AppState.update({ selectedLanguages: { ...st.selectedLanguages, detected } }, 'languages:detected');
          renderPois(st.pois);
        }, 180));

        map.on('click', (e) => {
          AppState.emit('map:clicked', { lat: e.latlng.lat, lon: e.latlng.lng });
        });

        return map;
      }

      function populateReferenceOverlays() {
        // Real curated corridor lines for quick visual overlay toggling alongside Overpass POIs
        const walkingSample = L.polyline([
          [56.458, -4.625], [56.385, -4.652], [56.255, -4.633]
        ], { color: '#22c55e', weight: 3, dashArray: '6,6' }).bindPopup('West Highland Way Corridor (Walking)');
        overlayGroups.walking.addLayer(walkingSample);

        const cyclingSample = L.polyline([
          [56.071, -3.439], [56.250, -3.550], [56.400, -3.430]
        ], { color: '#38bdf8', weight: 3 }).bindPopup('NCN Route 7 Corridor (Cycling)');
        overlayGroups.cycling.addLayer(cyclingSample);

        const mtbSample = L.polyline([
          [56.402, -3.192], [56.380, -3.140]
        ], { color: '#f97316', weight: 3, dashArray: '4,4' }).bindPopup('Dunkeld / Tay Trails (MTB)');
        overlayGroups.mtb.addLayer(mtbSample);

        const horseSample = L.polyline([
          [56.600, -3.850], [56.660, -3.790]
        ], { color: '#c084fc', weight: 3, dashArray: '2,6' }).bindPopup('Highland Bridleway Sector (Horse Riding)');
        overlayGroups.horse.addLayer(horseSample);

        const scenicSample = L.polyline([
          [56.185, -4.875], [56.250, -4.770], [56.395, -4.830]
        ], { color: '#facc15', weight: 4, opacity: 0.85 }).bindPopup('Arrochar & Glen Coe Scenic Drive');
        overlayGroups.scenic.addLayer(scenicSample);

        const parkSample = L.polygon([
          [56.02, -5.05], [56.02, -4.35], [56.46, -4.35], [56.46, -5.05]
        ], { color: '#10b981', weight: 2, fillOpacity: 0.08 }).bindPopup('Loch Lomond & The Trossachs National Park Boundary');
        overlayGroups.parks.addLayer(parkSample);
      }

      function setBaseMap(mode) {
        if (!map) return;
        const target = baseLayers[mode] || baseLayers.osm;
        if (activeBaseLayer && activeBaseLayer !== target) {
          map.removeLayer(activeBaseLayer);
        }
        if (!map.hasLayer(target)) {
          target.addTo(map);
        }
        activeBaseLayer = target;
      }

      function syncLayersFromState() {
        if (!map) return;
        const selected = new Set(AppState.getState().selectedLayers || []);
        if (selected.has('satellite')) setBaseMap('satellite');
        else if (selected.has('terrain')) setBaseMap('terrain');
        else setBaseMap('osm');

        for (const [key, group] of Object.entries(overlayGroups)) {
          if (selected.has(key)) {
            if (!map.hasLayer(group)) map.addLayer(group);
          } else if (map.hasLayer(group)) {
            map.removeLayer(group);
          }
        }
      }

      function renderPois(pois) {
        if (!map || !poiClusterGroup) return;
        poiClusterGroup.clearLayers();
        if (!Array.isArray(pois) || pois.length === 0) return;

        const bounds = map.getBounds().pad(0.15);
        const scaleCfg = ExplorerScaleEngine.getScaleConfig(AppState.getState().explorerScaleKm);
        const limit = Math.min(APP_CONFIG.maxRenderedMarkers, scaleCfg.poiLimit);

        const filtered = pois
          .filter((p) => Number.isFinite(p.lat) && Number.isFinite(p.lon) && bounds.contains([p.lat, p.lon]))
          .slice(0, limit);

        const markers = filtered.map((poi) => {
          const nameParts = MultilingualEngine.formatPlaceName(poi.tags || {}, poi.name || 'POI');
          const marker = L.circleMarker([poi.lat, poi.lon], {
            radius: poi.isMotorhome ? 7 : 6,
            fillColor: poi.isMotorhome ? '#22c55e' : '#38bdf8',
            color: '#0f172a',
            weight: 1.5,
            opacity: 1,
            fillOpacity: 0.9
          });

          const popupHtml = `
            <div style="min-width:190px">
              ${MultilingualEngine.formatPlaceHtml(poi.tags || {}, nameParts.primary)}
              <div style="font-size:11px;color:#94a3b8;margin:4px 0">Type: ${GeoUtils.escapeHtml(poi.category || 'poi')} · ${poi.lat.toFixed(4)}, ${poi.lon.toFixed(4)}</div>
              <div style="display:flex;gap:6px;flex-wrap:wrap;margin-top:6px">
                <button type="button" data-poi-action="add-route" data-poi-id="${GeoUtils.escapeHtml(poi.id)}" style="padding:4px 8px;font-size:11px;cursor:pointer">+ Route</button>
                <button type="button" data-poi-action="save-col" data-poi-id="${GeoUtils.escapeHtml(poi.id)}" style="padding:4px 8px;font-size:11px;cursor:pointer">+ Collection</button>
                <button type="button" data-poi-action="w3w" data-lat="${poi.lat}" data-lon="${poi.lon}" style="padding:4px 8px;font-size:11px;cursor:pointer">W3W</button>
              </div>
            </div>
          `;
          marker.bindPopup(popupHtml);
          return marker;
        });

        poiClusterGroup.addLayers(markers);
      }

      function renderRoute(route) {
        if (!map || !routeLayerGroup) return;
        routeLayerGroup.clearLayers();
        const coords = (route.geometry && route.geometry.length > 1)
          ? route.geometry.map((p) => [p.lat, p.lon])
          : (route.waypoints || []).map((w) => [w.lat, w.lon]);

        if (coords.length > 1) {
          const line = L.polyline(coords, {
            color: '#38bdf8',
            weight: 5,
            opacity: 0.92
          });
          routeLayerGroup.addLayer(line);
        }

        (route.waypoints || []).forEach((wp, idx) => {
          const icon = L.divIcon({
            className: 'wp-pin',
            html: `<div style="background:#0284c7;color:#fff;border:2px solid #fff;border-radius:50%;width:22px;height:22px;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;box-shadow:0 2px 6px rgba(0,0,0,0.4)">${idx + 1}</div>`,
            iconSize: [22, 22],
            iconAnchor: [11, 11]
          });
          const m = L.marker([wp.lat, wp.lon], { icon, draggable: true });
          m.bindPopup(`<strong>${idx + 1}. ${GeoUtils.escapeHtml(wp.name || 'Waypoint')}</strong>`);
          m.on('dragend', (ev) => {
            const pos = ev.target.getLatLng();
            RouteEngine.moveWaypoint(idx, pos.lat, pos.lng);
          });
          routeLayerGroup.addLayer(m);
        });
      }

      function renderGpxTracks(gpxItems) {
        if (!map || !gpxLayerGroup) return;
        gpxLayerGroup.clearLayers();
        for (const item of (gpxItems || [])) {
          if (!Array.isArray(item.points) || item.points.length < 2) continue;
          const latLngs = item.points.map((p) => [p.lat, p.lon]);
          const poly = L.polyline(latLngs, { color: '#f59e0b', weight: 4, opacity: 0.88 });
          poly.bindPopup(`<strong>GPX: ${GeoUtils.escapeHtml(item.name)}</strong><br/>${(item.distanceMeters / 1000).toFixed(2)} km · +${Math.round(item.ascentM)}m`);
          gpxLayerGroup.addLayer(poly);
        }
      }

      function setUserLocation(lat, lon, accuracy = null) {
        if (!map) return;
        if (!userMarker) {
          userMarker = L.circleMarker([lat, lon], {
            radius: 8,
            fillColor: '#22c55e',
            color: '#ffffff',
            weight: 2,
            fillOpacity: 1
          }).addTo(map).bindPopup('Current GPS Position');
        } else {
          userMarker.setLatLng([lat, lon]);
        }
        if (accuracy) {
          if (!userAccuracyCircle) {
            userAccuracyCircle = L.circle([lat, lon], { radius: accuracy, color: '#22c55e', fillOpacity: 0.1, weight: 1 }).addTo(map);
          } else {
            userAccuracyCircle.setLatLng([lat, lon]).setRadius(accuracy);
          }
        }
      }

      function setView(lat, lon, zoom = null) {
        if (!map) return;
        map.setView([lat, lon], zoom || map.getZoom());
      }

      function setZoom(zoom) {
        if (!map) return;
        map.setZoom(zoom);
      }

      function getCenter() {
        if (!map) {
          const c = AppState.getState().mapView.center;
          return { lat: c[0], lon: c[1] };
        }
        const c = map.getCenter();
        return { lat: c.lat, lon: c.lng };
      }

      function isReady() {
        return Boolean(map);
      }

      return {
        init,
        setBaseMap,
        syncLayersFromState,
        renderPois,
        renderRoute,
        renderGpxTracks,
        setUserLocation,
        setView,
        setZoom,
        getCenter,
        isReady
      };
    })();

    /* =========================================================================
       OVERPASS ENGINE (MULTI-ENDPOINT FAILOVER, RETRY, TIMEOUT, CACHE, VALID QL)
       ========================================================================= */
    const OverpassEngine = (() => {
      function buildOverpassQuery(lat, lon, radiusMeters, options = {}) {
        const clampedRadius = Math.min(Math.max(Number(radiusMeters) || 10000, 250), 150000);
        const includeMotorhome = Boolean(options.includeMotorhome);
        const categories = Array.isArray(options.categories) && options.categories.length
          ? options.categories
          : ['viewpoint', 'attraction', 'picnic_site', 'restaurant', 'cafe'];

        const clauses = [];
        if (categories.includes('viewpoint')) clauses.push(`node["tourism"="viewpoint"](around:${clampedRadius},${lat},${lon});`);
        if (categories.includes('attraction')) clauses.push(`nwr["tourism"="attraction"](around:${clampedRadius},${lat},${lon});`);
        if (categories.includes('picnic_site')) clauses.push(`node["tourism"="picnic_site"](around:${clampedRadius},${lat},${lon});`);
        if (categories.includes('restaurant')) clauses.push(`node["amenity"="restaurant"](around:${clampedRadius},${lat},${lon});`);
        if (categories.includes('cafe')) clauses.push(`node["amenity"="cafe"](around:${clampedRadius},${lat},${lon});`);

        if (includeMotorhome) {
          clauses.push(`nwr["tourism"="caravan_site"](around:${clampedRadius},${lat},${lon});`);
          clauses.push(`nwr["tourism"="camp_site"](around:${clampedRadius},${lat},${lon});`);
          clauses.push(`nwr["campervan"="yes"](around:${clampedRadius},${lat},${lon});`);
          clauses.push(`node["amenity"="drinking_water"](around:${clampedRadius},${lat},${lon});`);
          clauses.push(`node["amenity"="sanitary_dump_station"](around:${clampedRadius},${lat},${lon});`);
          clauses.push(`node["fuel:lpg"="yes"](around:${clampedRadius},${lat},${lon});`);
          clauses.push(`node["amenity"="fuel"](around:${clampedRadius},${lat},${lon});`);
          clauses.push(`node["amenity"="charging_station"](around:${clampedRadius},${lat},${lon});`);
        }

        if (clauses.length === 0) {
          clauses.push(`node["tourism"="viewpoint"](around:${clampedRadius},${lat},${lon});`);
        }

        return `[out:json][timeout:25];\n(\n  ${clauses.join('\n  ')}\n);\nout center 450;`;
      }

      function normalizeElements(elements = [], motorhomeOnly = false) {
        const items = [];
        for (const el of elements) {
          const lat = el.lat ?? el.center?.lat;
          const lon = el.lon ?? el.center?.lon;
          if (!Number.isFinite(lat) || !Number.isFinite(lon)) continue;
          const tags = el.tags || {};
          const isMotorhome = Boolean(
            tags.tourism === 'caravan_site' ||
            tags.tourism === 'camp_site' ||
            tags.campervan === 'yes' ||
            tags.amenity === 'drinking_water' ||
            tags.amenity === 'sanitary_dump_station' ||
            tags['fuel:lpg'] === 'yes' ||
            tags.amenity === 'fuel' ||
            tags.amenity === 'charging_station'
          );
          if (motorhomeOnly && !isMotorhome) continue;

          const category = tags.tourism || tags.amenity || (tags['fuel:lpg'] === 'yes' ? 'lpg' : 'poi');
          const nameParts = MultilingualEngine.formatPlaceName(tags, `OSM ${category}`);
          items.push({
            id: `osm_${el.type}_${el.id}`,
            osmType: el.type,
            osmId: el.id,
            name: nameParts.primary,
            names: nameParts.all,
            category,
            isMotorhome,
            lat,
            lon,
            tags
          });
        }
        return items;
      }

      async function queryPois(lat, lon, radiusMeters, options = {}) {
        const query = buildOverpassQuery(lat, lon, radiusMeters, options);
        const cacheKey = `ovp_${lat.toFixed(3)}_${lon.toFixed(3)}_${radiusMeters}_${options.includeMotorhome ? 'mh' : 'std'}_${(options.categories || []).join(',')}`;

        if (!options.forceRefresh) {
          const cached = await StorageEngine.getTimedCache('overpassCache', cacheKey);
          if (Array.isArray(cached) && cached.length > 0) {
            return { pois: cached, fromCache: true, query };
          }
        }

        let lastError = null;
        for (const endpoint of APP_CONFIG.overpassEndpoints) {
          try {
            const res = await GeoUtils.fetchWithRetry(endpoint, {
              method: 'POST',
              headers: { 'Content-Type': 'application/x-www-form-urlencoded;charset=UTF-8' },
              body: `data=${encodeURIComponent(query)}`
            }, 1, APP_CONFIG.requestTimeoutMs);

            if (!res.ok) throw new Error(`Overpass ${endpoint} HTTP ${res.status}`);
            const data = await res.json();
            const normalized = normalizeElements(data.elements || [], Boolean(options.motorhomeOnly));
            await StorageEngine.setTimedCache('overpassCache', cacheKey, normalized, APP_CONFIG.cacheTtlMs.overpass);
            await StorageEngine.idbBulkPut('pois', normalized.slice(0, APP_CONFIG.maxCachedPois));
            return { pois: normalized, fromCache: false, endpoint, query };
          } catch (err) {
            lastError = err;
          }
        }

        // Fallback to any cached POIs in IndexedDB if offline or endpoints busy
        const fallbackAll = await StorageEngine.idbGetAll('pois');
        if (fallbackAll.length > 0) {
          const nearby = fallbackAll.filter((p) => GeoUtils.haversineMeters(lat, lon, p.lat, p.lon) <= radiusMeters * 1.5);
          return {
            pois: nearby.length > 0 ? nearby : fallbackAll.slice(0, 200),
            fromCache: true,
            fallback: true,
            query,
            error: lastError?.message
          };
        }

        throw lastError || new Error('All Overpass endpoints failed');
      }

      async function searchLocations(queryText) {
        const clean = GeoUtils.sanitizeText(queryText, 120);
        if (!clean) return [];
        const url = `${APP_CONFIG.nominatimEndpoint}?format=jsonv2&limit=8&q=${encodeURIComponent(clean)}`;
        const res = await GeoUtils.fetchWithRetry(url, {
          headers: { Accept: 'application/json' }
        }, 1, 10000);
        if (!res.ok) throw new Error(`Search failed: HTTP ${res.status}`);
        const rows = await res.json();
        return rows.map((r) => ({
          id: `nom_${r.place_id}`,
          name: r.display_name.split(',')[0],
          displayName: r.display_name,
          lat: Number(r.lat),
          lon: Number(r.lon),
          type: r.type || 'place'
        }));
      }

      return { buildOverpassQuery, queryPois, searchLocations };
    })();

    /* =========================================================================
       WEATHER ENGINE (OPEN-METEO + SUITABILITY FOR DISCOVER/EVENTS/ROUTES/NAV/PHOTO)
       ========================================================================= */
    const WeatherEngine = (() => {
      function describeWmoCode(code) {
        const map = {
          0: ['Clear sky', '☀️'],
          1: ['Mainly clear', '🌤️'],
          2: ['Partly cloudy', '⛅'],
          3: ['Overcast', '☁️'],
          45: ['Fog', '🌫️'],
          48: ['Depositing rime fog', '🌫️'],
          51: ['Light drizzle', '🌦️'],
          61: ['Slight rain', '🌧️'],
          63: ['Moderate rain', '🌧️'],
          65: ['Heavy rain', '⛈️'],
          71: ['Slight snow', '🌨️'],
          80: ['Rain showers', '🌦️'],
          95: ['Thunderstorm', '⛈️']
        };
        return map[code] || [`Weather code ${code}`, '🌡️'];
      }

      async function fetchWeather(lat, lon, forceRefresh = false) {
        const key = `wx_${lat.toFixed(2)}_${lon.toFixed(2)}`;
        if (!forceRefresh) {
          const cached = await StorageEngine.getTimedCache('weatherCache', key);
          if (cached) return { ...cached, fromCache: true };
        }

        const params = new URLSearchParams({
          latitude: String(lat),
          longitude: String(lon),
          current: 'temperature_2m,precipitation,rain,wind_speed_10m,wind_gusts_10m,weather_code,uv_index',
          hourly: 'temperature_2m,precipitation_probability,precipitation,wind_speed_10m,visibility,uv_index,weather_code',
          daily: 'weather_code,temperature_2m_max,temperature_2m_min,precipitation_sum,wind_speed_10m_max,uv_index_max',
          timezone: 'auto',
          forecast_days: '5'
        });

        const res = await GeoUtils.fetchWithRetry(`${APP_CONFIG.openMeteoEndpoint}?${params.toString()}`, {}, 1, 10000);
        if (!res.ok) throw new Error(`Open-Meteo HTTP ${res.status}`);
        const raw = await res.json();

        const cur = raw.current || {};
        const [conditionText, icon] = describeWmoCode(cur.weather_code ?? 0);
        const visibilityM = Array.isArray(raw.hourly?.visibility) ? (raw.hourly.visibility[0] ?? 10000) : 10000;
        const warnings = [];
        if ((cur.wind_gusts_10m || 0) >= 50 || (cur.wind_speed_10m || 0) >= 40) {
          warnings.push('Strong wind / gusts advisory for outdoor & motorhome travel');
        }
        if ((cur.precipitation || 0) > 2 || (cur.weather_code || 0) >= 63) {
          warnings.push('Wet / rainy conditions — consider Bad Weather Alternatives');
        }
        if ((cur.uv_index || 0) >= 6) {
          warnings.push('High UV index — sun protection advised');
        }

        const daily = (raw.daily?.time || []).map((date, idx) => {
          const [dCond, dIcon] = describeWmoCode(raw.daily.weather_code?.[idx] ?? 0);
          return {
            date,
            condition: dCond,
            icon: dIcon,
            maxC: raw.daily.temperature_2m_max?.[idx],
            minC: raw.daily.temperature_2m_min?.[idx],
            precipMm: raw.daily.precipitation_sum?.[idx] ?? 0,
            windMaxKmh: raw.daily.wind_speed_10m_max?.[idx] ?? 0,
            uvMax: raw.daily.uv_index_max?.[idx] ?? 0
          };
        });

        const processed = {
          lat,
          lon,
          fetchedAt: Date.now(),
          current: {
            tempC: cur.temperature_2m,
            rainMm: cur.rain ?? cur.precipitation ?? 0,
            windKmh: cur.wind_speed_10m ?? 0,
            gustKmh: cur.wind_gusts_10m ?? 0,
            visibilityKm: Number((visibilityM / 1000).toFixed(1)),
            uv: cur.uv_index ?? 0,
            condition: conditionText,
            icon
          },
          warnings,
          daily
        };

        await StorageEngine.setTimedCache('weatherCache', key, processed, APP_CONFIG.cacheTtlMs.weather);
        AppState.update({ weatherData: processed }, 'weather:updated');
        return processed;
      }

      function computeSuitability(weather) {
        if (!weather?.current) {
          return {
            score: 75,
            discoverAdvice: 'General exploration suitable; refresh weather for live conditions.',
            eventsAdvice: 'Check local venue status before heading out.',
            routesAdvice: 'Standard route planning active.',
            navigationAdvice: 'Standard GPS & turn-by-turn guidance.',
            photographyAdvice: 'Golden hour light recommended.'
          };
        }
        const c = weather.current;
        let score = 95;
        if (c.rainMm > 0.2) score -= Math.min(35, c.rainMm * 10);
        if (c.windKmh > 25) score -= Math.min(30, (c.windKmh - 25) * 1.1);
        if (c.visibilityKm < 4) score -= 20;
        score = Math.max(15, Math.min(100, Math.round(score)));

        return {
          score,
          discoverAdvice: c.rainMm > 1
            ? 'Rainy conditions: prioritise Bad Weather Alternatives & indoor gems.'
            : 'Clear/manageable conditions: great for Viewpoints, Scenic Routes & Hidden Gems.',
          eventsAdvice: c.rainMm > 2 || c.gustKmh > 45
            ? 'Outdoor events may be disrupted; ask AI for indoor/covered alternatives.'
            : 'Favourable conditions for outdoor markets, festivals & gatherings.',
          routesAdvice: c.gustKmh > 45
            ? 'High gusts: favour sheltered valleys & lower-exposure motorhome routes.'
            : 'Good traction & route conditions across planned waypoints.',
          navigationAdvice: c.visibilityKm < 2
            ? 'Reduced visibility: rely on close turn-by-turn prompts & slow down.'
            : 'Normal navigation visibility.',
          photographyAdvice: (c.visibilityKm >= 8 && c.rainMm < 0.5)
            ? 'Crisp visibility for landscape & viewpoint photography.'
            : 'Moody atmospheric clouds/mist — ideal for dramatic shots, protect lens from rain.'
        };
      }

      return { fetchWeather, computeSuitability };
    })();

    /* =========================================================================
       ELEVATION ENGINE (OPENTOPODATA WITH OPEN ELEVATION FALLBACK)
       ========================================================================= */
    const ElevationEngine = (() => {
      function samplePoints(coords, maxSamples = 60) {
        if (!Array.isArray(coords) || coords.length === 0) return [];
        if (coords.length <= maxSamples) return coords;
        const step = (coords.length - 1) / (maxSamples - 1);
        const sampled = [];
        for (let i = 0; i < maxSamples; i++) {
          sampled.push(coords[Math.round(i * step)]);
        }
        return sampled;
      }

      async function fetchElevationsForCoords(coords) {
        const sampled = samplePoints(coords, 60);
        if (sampled.length === 0) return [];
        const locationsStr = sampled.map((p) => `${p.lat.toFixed(5)},${p.lon.toFixed(5)}`).join('|');
        const cacheKey = `ele_${sampled.length}_${sampled[0].lat.toFixed(2)}_${sampled[0].lon.toFixed(2)}_${sampled[sampled.length - 1].lat.toFixed(2)}_${sampled[sampled.length - 1].lon.toFixed(2)}`;

        const cached = await StorageEngine.getTimedCache('elevationCache', cacheKey);
        if (Array.isArray(cached) && cached.length === sampled.length) {
          return cached;
        }

        try {
          const url = `${APP_CONFIG.openTopoDataEndpoint}?locations=${encodeURIComponent(locationsStr)}`;
          const res = await GeoUtils.fetchWithRetry(url, {}, 1, 10000);
          if (!res.ok) throw new Error(`OpenTopoData HTTP ${res.status}`);
          const json = await res.json();
          const results = (json.results || []).map((r, idx) => ({
            lat: sampled[idx].lat,
            lon: sampled[idx].lon,
            ele: Number.isFinite(r.elevation) ? r.elevation : 0
          }));
          if (results.length === sampled.length) {
            await StorageEngine.setTimedCache('elevationCache', cacheKey, results, APP_CONFIG.cacheTtlMs.elevation);
            return results;
          }
          throw new Error('Incomplete OpenTopoData response');
        } catch {
          const body = JSON.stringify({
            locations: sampled.map((p) => ({ latitude: p.lat, longitude: p.lon }))
          });
          const res2 = await GeoUtils.fetchWithRetry(APP_CONFIG.openElevationEndpoint, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body
          }, 1, 12000);
          if (!res2.ok) throw new Error(`Open Elevation HTTP ${res2.status}`);
          const json2 = await res2.json();
          const results2 = (json2.results || []).map((r, idx) => ({
            lat: sampled[idx].lat,
            lon: sampled[idx].lon,
            ele: Number.isFinite(r.elevation) ? r.elevation : 0
          }));
          await StorageEngine.setTimedCache('elevationCache', cacheKey, results2, APP_CONFIG.cacheTtlMs.elevation);
          return results2;
        }
      }

      function analyzeProfile(pointsWithEle) {
        if (!Array.isArray(pointsWithEle) || pointsWithEle.length === 0) {
          return {
            points: [],
            ascentM: 0,
            descentM: 0,
            minEleM: 0,
            maxEleM: 0,
            maxGradientPct: 0,
            avgGradientPct: 0,
            difficulty: 'Easy',
            scenicScore: 70
          };
        }

        let ascentM = 0;
        let descentM = 0;
        let minEleM = Infinity;
        let maxEleM = -Infinity;
        let maxGradientPct = 0;
        let totalDistM = 0;
        let cumDistM = 0;

        const enriched = pointsWithEle.map((pt, idx) => {
          const ele = Number(pt.ele) || 0;
          if (ele < minEleM) minEleM = ele;
          if (ele > maxEleM) maxEleM = ele;
          if (idx > 0) {
            const segDist = GeoUtils.haversineMeters(pointsWithEle[idx - 1].lat, pointsWithEle[idx - 1].lon, pt.lat, pt.lon);
            totalDistM += segDist;
            cumDistM += segDist;
            const diff = ele - (Number(pointsWithEle[idx - 1].ele) || 0);
            if (diff > 0) ascentM += diff;
            else descentM += Math.abs(diff);
            if (segDist > 5) {
              const grad = Math.abs((diff / segDist) * 100);
              if (grad > maxGradientPct) maxGradientPct = grad;
            }
          }
          return { ...pt, ele, cumDistKm: Number((cumDistM / 1000).toFixed(2)) };
        });

        const avgGradientPct = totalDistM > 0 ? Number(((ascentM / totalDistM) * 100).toFixed(1)) : 0;
        const reliefM = maxEleM - minEleM;

        let difficulty = 'Easy';
        if (ascentM > 1200 || maxGradientPct > 16 || totalDistM > 45000) difficulty = 'Strenuous';
        else if (ascentM > 450 || maxGradientPct > 10 || totalDistM > 18000) difficulty = 'Moderate';

        const scenicScore = Math.max(45, Math.min(99, Math.round(62 + Math.min(25, reliefM / 35) + Math.min(12, ascentM / 150))));

        return {
          points: enriched,
          ascentM: Math.round(ascentM),
          descentM: Math.round(descentM),
          minEleM: Math.round(minEleM),
          maxEleM: Math.round(maxEleM),
          maxGradientPct: Number(maxGradientPct.toFixed(1)),
          avgGradientPct,
          difficulty,
          scenicScore
        };
      }

      async function buildProfileForCoords(coords) {
        const hasEle = coords.every((p) => Number.isFinite(p.ele));
        const pts = hasEle ? coords.slice(0, 120) : await fetchElevationsForCoords(coords);
        const analysis = analyzeProfile(pts);
        AppState.update({ elevationProfile: analysis }, 'elevation:updated');
        return analysis;
      }

      function renderSvgProfile(analysis) {
        const pts = analysis?.points || [];
        if (pts.length < 2) {
          return `<svg class="elevation-svg" viewBox="0 0 360 110"><text x="180" y="58" fill="#94a3b8" font-size="12" text-anchor="middle">No elevation profile loaded yet</text></svg>`;
        }
        const w = 360;
        const h = 110;
        const pad = 12;
        const minE = analysis.minEleM;
        const spanE = Math.max(10, analysis.maxEleM - minE);
        const coordsSvg = pts.map((p, i) => {
          const x = pad + (i / (pts.length - 1)) * (w - pad * 2);
          const y = h - pad - ((p.ele - minE) / spanE) * (h - pad * 2);
          return `${x.toFixed(1)},${y.toFixed(1)}`;
        });
        const areaD = `M ${pad},${h - pad} L ${coordsSvg.join(' L ')} L ${w - pad},${h - pad} Z`;
        const lineD = `M ${coordsSvg.join(' L ')}`;
        return `
          <svg class="elevation-svg" viewBox="0 0 ${w} ${h}" role="img" aria-label="Elevation Profile Chart">
            <path d="${areaD}" fill="rgba(56, 189, 248, 0.22)" />
            <path d="${lineD}" fill="none" stroke="#38bdf8" stroke-width="2.2" />
            <text x="${pad}" y="12" fill="#94a3b8" font-size="10">Max: ${analysis.maxEleM}m · Min: ${analysis.minEleM}m · +${analysis.ascentM}m</text>
          </svg>
        `;
      }

      return { fetchElevationsForCoords, analyzeProfile, buildProfileForCoords, renderSvgProfile };
    })();

    /* =========================================================================
       GPX ENGINE (IMPORT GPX, PARSE ROUTES/TRACKS/WAYPOINTS/ELE/META, EXPORT)
       ========================================================================= */
    const GPXEngine = (() => {
      function parseGpxXml(xmlText, fallbackName = 'Imported GPX') {
        const parser = new DOMParser();
        const doc = parser.parseFromString(xmlText, 'application/xml');
        if (doc.querySelector('parsererror')) {
          throw new Error('Invalid GPX XML structure');
        }

        const metaName = doc.querySelector('metadata > name')?.textContent ||
                         doc.querySelector('trk > name')?.textContent ||
                         doc.querySelector('rte > name')?.textContent ||
                         fallbackName;

        const waypoints = [];
        doc.querySelectorAll('wpt').forEach((wpt, idx) => {
          const lat = parseFloat(wpt.getAttribute('lat'));
          const lon = parseFloat(wpt.getAttribute('lon'));
          if (!Number.isFinite(lat) || !Number.isFinite(lon)) return;
          const ele = parseFloat(wpt.querySelector('ele')?.textContent);
          waypoints.push({
            id: `wpt_${idx}_${Date.now()}`,
            name: GeoUtils.sanitizeText(wpt.querySelector('name')?.textContent || `Waypoint ${idx + 1}`, 80),
            lat,
            lon,
            ele: Number.isFinite(ele) ? ele : null
          });
        });

        const points = [];
        const addPtEl = (el) => {
          if (points.length >= APP_CONFIG.maxGpxPoints) return;
          const lat = parseFloat(el.getAttribute('lat'));
          const lon = parseFloat(el.getAttribute('lon'));
          if (!Number.isFinite(lat) || !Number.isFinite(lon)) return;
          const ele = parseFloat(el.querySelector('ele')?.textContent);
          const time = el.querySelector('time')?.textContent || null;
          points.push({ lat, lon, ele: Number.isFinite(ele) ? ele : null, time });
        };

        doc.querySelectorAll('trkpt').forEach(addPtEl);
        if (points.length === 0) {
          doc.querySelectorAll('rtept').forEach(addPtEl);
        }

        const distanceMeters = GeoUtils.calculatePathDistanceMeters(points);
        const eleAnalysis = ElevationEngine.analyzeProfile(points.filter((p) => Number.isFinite(p.ele)));

        return {
          id: `gpx_${Date.now()}_${Math.random().toString(36).slice(2, 7)}`,
          name: GeoUtils.sanitizeText(metaName, 100),
          createdAt: new Date().toISOString(),
          waypoints,
          points,
          distanceMeters,
          ascentM: eleAnalysis.ascentM,
          descentM: eleAnalysis.descentM,
          elevationAnalysis: eleAnalysis
        };
      }

      async function importGpxText(xmlText, filename = 'Track.gpx') {
        const parsed = parseGpxXml(xmlText, filename.replace(/\.gpx$/i, ''));
        await StorageEngine.idbPut('gpx', parsed);
        const allGpx = await StorageEngine.idbGetAll('gpx');
        AppState.update({ gpxItems: allGpx }, 'gpx:updated');
        MapEngine.renderGpxTracks(allGpx);
        return parsed;
      }

      function generateGpxXml(name, points = [], waypoints = []) {
        const safeName = GeoUtils.escapeHtml(name || 'Global Explorer Route');
        const wptXml = (waypoints || []).map((w) => {
          const eleTag = Number.isFinite(w.ele) ? `\n    <ele>${w.ele}</ele>` : '';
          return `  <wpt lat="${w.lat}" lon="${w.lon}">${eleTag}\n    <name>${GeoUtils.escapeHtml(w.name || 'Waypoint')}</name>\n  </wpt>`;
        }).join('\n');

        const trkPtXml = (points || []).map((p) => {
          const eleTag = Number.isFinite(p.ele) ? `<ele>${p.ele}</ele>` : '';
          return `      <trkpt lat="${p.lat}" lon="${p.lon}">${eleTag}</trkpt>`;
        }).join('\n');

        return `<?xml version="1.0" encoding="UTF-8"?>
<gpx version="1.1" creator="Global Explorer Lite V2" xmlns="http://www.topografix.com/GPX/1/1">
  <metadata>
    <name>${safeName}</name>
    <time>${new Date().toISOString()}</time>
  </metadata>
${wptXml}
  <trk>
    <name>${safeName}</name>
    <trkseg>
${trkPtXml}
    </trkseg>
  </trk>
</gpx>`;
      }

      return { parseGpxXml, importGpxText, generateGpxXml };
    })();

    /* =========================================================================
       ROUTING & ROUTE EDITING ENGINE (OSRM + HEURISTIC OPTIMISE + UNDO/REDO)
       ========================================================================= */
    const RouteEngine = (() => {
      function pushUndoSnapshot() {
        const st = AppState.getState();
        const snap = {
          waypoints: JSON.parse(JSON.stringify(st.route.waypoints)),
          geometry: JSON.parse(JSON.stringify(st.route.geometry)),
          distanceMeters: st.route.distanceMeters,
          durationSeconds: st.route.durationSeconds,
          instructions: JSON.parse(JSON.stringify(st.route.instructions))
        };
        const undoStack = [...st.route.undoStack.slice(-24), snap];
        AppState.update({ route: { ...st.route, undoStack, redoStack: [] } });
      }

      async function addWaypoint(lat, lon, name = 'Waypoint', type = 'waypoint') {
        const st = AppState.getState();
        if (st.route.waypoints.length >= APP_CONFIG.maxRouteWaypoints) {
          showToast(`Maximum ${APP_CONFIG.maxRouteWaypoints} waypoints reached`, 'warn');
          return;
        }
        pushUndoSnapshot();
        const wp = {
          id: `wp_${Date.now()}_${Math.random().toString(36).slice(2, 6)}`,
          name: GeoUtils.sanitizeText(name, 90),
          lat: Number(lat),
          lon: Number(lon),
          type
        };
        const waypoints = [...st.route.waypoints, wp];
        AppState.update({ route: { ...st.route, waypoints } }, 'route:changed');
        await computeRoute(waypoints);
      }

      async function moveWaypoint(index, lat, lon) {
        const st = AppState.getState();
        if (!st.route.waypoints[index]) return;
        pushUndoSnapshot();
        const waypoints = st.route.waypoints.map((w, i) => i === index ? { ...w, lat: Number(lat), lon: Number(lon) } : w);
        AppState.update({ route: { ...st.route, waypoints } }, 'route:changed');
        await computeRoute(waypoints);
      }

      async function removeWaypoint(index) {
        const st = AppState.getState();
        if (!st.route.waypoints[index]) return;
        pushUndoSnapshot();
        const waypoints = st.route.waypoints.filter((_, i) => i !== index);
        AppState.update({ route: { ...st.route, waypoints } }, 'route:changed');
        await computeRoute(waypoints);
      }

      async function optimiseWaypointsHeuristic() {
        const st = AppState.getState();
        const wps = st.route.waypoints;
        if (wps.length < 3) return;
        pushUndoSnapshot();

        // Nearest-neighbour client-side heuristic keeping start and end anchors
        const start = wps[0];
        const end = wps[wps.length - 1];
        const remaining = wps.slice(1, -1);
        const ordered = [start];
        let curr = start;
        while (remaining.length > 0) {
          let bestIdx = 0;
          let bestDist = Infinity;
          for (let i = 0; i < remaining.length; i++) {
            const d = GeoUtils.haversineMeters(curr.lat, curr.lon, remaining[i].lat, remaining[i].lon);
            if (d < bestDist) {
              bestDist = d;
              bestIdx = i;
            }
          }
          const next = remaining.splice(bestIdx, 1)[0];
          ordered.push(next);
          curr = next;
        }
        ordered.push(end);
        AppState.update({ route: { ...st.route, waypoints: ordered } }, 'route:changed');
        await computeRoute(ordered);
      }

      async function splitRouteAt(index) {
        const st = AppState.getState();
        if (index <= 0 || index >= st.route.waypoints.length) return null;
        const firstHalf = st.route.waypoints.slice(0, index);
        const secondHalf = st.route.waypoints.slice(index);
        await saveRouteRecord(`${st.route.name} (Part 1)`, firstHalf);
        await saveRouteRecord(`${st.route.name} (Part 2)`, secondHalf);
        pushUndoSnapshot();
        AppState.update({ route: { ...st.route, waypoints: firstHalf } }, 'route:changed');
        await computeRoute(firstHalf);
        return { firstHalf, secondHalf };
      }

      async function mergeRouteWaypoints(extraWaypoints = []) {
        if (!Array.isArray(extraWaypoints) || extraWaypoints.length === 0) return;
        const st = AppState.getState();
        pushUndoSnapshot();
        const merged = [...st.route.waypoints, ...extraWaypoints].slice(0, APP_CONFIG.maxRouteWaypoints);
        AppState.update({ route: { ...st.route, waypoints: merged } }, 'route:changed');
        await computeRoute(merged);
      }

      async function undo() {
        const st = AppState.getState();
        if (st.route.undoStack.length === 0) return;
        const prev = st.route.undoStack[st.route.undoStack.length - 1];
        const redoStack = [...st.route.redoStack, {
          waypoints: st.route.waypoints,
          geometry: st.route.geometry,
          distanceMeters: st.route.distanceMeters,
          durationSeconds: st.route.durationSeconds,
          instructions: st.route.instructions
        }];
        AppState.update({
          route: {
            ...st.route,
            ...prev,
            undoStack: st.route.undoStack.slice(0, -1),
            redoStack
          }
        }, 'route:changed');
        MapEngine.renderRoute(AppState.getState().route);
      }

      async function redo() {
        const st = AppState.getState();
        if (st.route.redoStack.length === 0) return;
        const next = st.route.redoStack[st.route.redoStack.length - 1];
        const undoStack = [...st.route.undoStack, {
          waypoints: st.route.waypoints,
          geometry: st.route.geometry,
          distanceMeters: st.route.distanceMeters,
          durationSeconds: st.route.durationSeconds,
          instructions: st.route.instructions
        }];
        AppState.update({
          route: {
            ...st.route,
            ...next,
            undoStack,
            redoStack: st.route.redoStack.slice(0, -1)
          }
        }, 'route:changed');
        MapEngine.renderRoute(AppState.getState().route);
      }

      function mapProfileToOsrm(mode) {
        if (mode === 'walking' || mode === 'horse') return 'foot';
        if (mode === 'cycling' || mode === 'mtb') return 'bicycle';
        return 'driving';
      }

      async function computeRoute(waypoints = AppState.getState().route.waypoints) {
        const st = AppState.getState();
        if (!Array.isArray(waypoints) || waypoints.length < 2) {
          const updated = {
            ...st.route,
            waypoints,
            geometry: waypoints.map((w) => ({ lat: w.lat, lon: w.lon })),
            distanceMeters: 0,
            durationSeconds: 0,
            instructions: []
          };
          AppState.update({ route: updated }, 'route:updated');
          MapEngine.renderRoute(updated);
          return updated;
        }

        const profile = mapProfileToOsrm(st.travelMode);
        const coordsParam = waypoints.map((w) => `${w.lon},${w.lat}`).join(';');
        const url = `${APP_CONFIG.osrmEndpoint}/${profile}/${coordsParam}?overview=full&geometries=geojson&steps=true`;

        try {
          const res = await GeoUtils.fetchWithRetry(url, {}, 1, 10000);
          if (!res.ok) throw new Error(`OSRM HTTP ${res.status}`);
          const data = await res.json();
          const r = data.routes?.[0];
          if (!r) throw new Error('No route returned');

          const geometry = (r.geometry?.coordinates || []).map(([lon, lat]) => ({ lat, lon }));
          const instructions = [];
          for (const leg of (r.legs || [])) {
            for (const step of (leg.steps || [])) {
              const loc = step.maneuver?.location || [geometry[0].lon, geometry[0].lat];
              instructions.push({
                text: step.maneuver?.instruction || step.name || 'Continue along route',
                distanceMeters: Math.round(step.distance || 0),
                durationSeconds: Math.round(step.duration || 0),
                lat: loc[1],
                lon: loc[0]
              });
            }
          }

          const updated = {
            ...st.route,
            waypoints,
            geometry,
            distanceMeters: Math.round(r.distance || 0),
            durationSeconds: Math.round(r.duration || 0),
            instructions
          };
          AppState.update({ route: updated }, 'route:updated');
          MapEngine.renderRoute(updated);
          await StorageEngine.idbPut('navigationData', { id: 'active_route', route: updated, updatedAt: Date.now() });
          return updated;
        } catch {
          // Graceful fallback to direct / cached geometry when offline or OSRM unreachable
          const geometry = waypoints.map((w) => ({ lat: w.lat, lon: w.lon }));
          const dist = Math.round(GeoUtils.calculatePathDistanceMeters(geometry));
          const speedMps = st.travelMode === 'walking' ? 1.3 : (st.travelMode === 'cycling' || st.travelMode === 'mtb') ? 4.2 : 14;
          const instructions = waypoints.slice(0, -1).map((w, i) => {
            const nxt = waypoints[i + 1];
            return {
              text: `Head toward ${nxt.name || `Stop ${i + 2}`}`,
              distanceMeters: Math.round(GeoUtils.haversineMeters(w.lat, w.lon, nxt.lat, nxt.lon)),
              durationSeconds: Math.round(GeoUtils.haversineMeters(w.lat, w.lon, nxt.lat, nxt.lon) / speedMps),
              lat: w.lat,
              lon: w.lon
            };
          });
          const updated = {
            ...st.route,
            waypoints,
            geometry,
            distanceMeters: dist,
            durationSeconds: Math.round(dist / speedMps),
            instructions
          };
          AppState.update({ route: updated }, 'route:updated');
          MapEngine.renderRoute(updated);
          return updated;
        }
      }

      async function saveRouteRecord(customName = null, customWaypoints = null) {
        const st = AppState.getState();
        const name = GeoUtils.sanitizeText(customName || st.route.name || 'Saved Route', 100);
        const wps = customWaypoints || st.route.waypoints;
        const record = {
          id: st.route.id && !customName ? st.route.id : `rt_${Date.now()}_${Math.random().toString(36).slice(2, 6)}`,
          name,
          mode: st.travelMode,
          waypoints: wps,
          geometry: st.route.geometry,
          distanceMeters: st.route.distanceMeters,
          durationSeconds: st.route.durationSeconds,
          instructions: st.route.instructions,
          savedAt: new Date().toISOString()
        };
        await StorageEngine.idbPut('routes', record);
        AppState.update({ route: { ...st.route, id: record.id, name: record.name } }, 'route:saved');
        return record;
      }

      async function loadSavedRoute(routeId) {
        const rec = await StorageEngine.idbGet('routes', routeId);
        if (!rec) return null;
        const st = AppState.getState();
        const loaded = {
          ...st.route,
          id: rec.id,
          name: rec.name,
          waypoints: rec.waypoints || [],
          geometry: rec.geometry || [],
          distanceMeters: rec.distanceMeters || 0,
          durationSeconds: rec.durationSeconds || 0,
          instructions: rec.instructions || [],
          undoStack: [],
          redoStack: []
        };
        AppState.update({ route: loaded, travelMode: rec.mode || st.travelMode }, 'route:loaded');
        MapEngine.renderRoute(loaded);
        if (loaded.waypoints[0]) MapEngine.setView(loaded.waypoints[0].lat, loaded.waypoints[0].lon, 11);
        return loaded;
      }

      return {
        addWaypoint,
        moveWaypoint,
        removeWaypoint,
        optimiseWaypointsHeuristic,
        splitRouteAt,
        mergeRouteWaypoints,
        undo,
        redo,
        computeRoute,
        saveRouteRecord,
        loadSavedRoute
      };
    })();

    /* =========================================================================
       ROUTE QUALITY ENGINE (SCORING ACROSS ALL SPEC DIMENSIONS)
       ========================================================================= */
    const RouteQualityEngine = (() => {
      function scoreRoute(route, weather, elevationAnalysis, vehicleProfile, mode = 'motorhome') {
        const distKm = (route?.distanceMeters || 0) / 1000;
        const wpCount = route?.waypoints?.length || 0;
        const ascent = elevationAnalysis?.ascentM || 0;
        const maxGrad = elevationAnalysis?.maxGradientPct || 0;
        const wx = weather?.current;

        const distanceScore = distKm === 0 ? 50 : (distKm <= 350 ? 92 : Math.max(50, Math.round(95 - (distKm - 350) / 25)));
        const scenicScore = elevationAnalysis?.scenicScore || (70 + Math.min(20, wpCount * 3));
        const weatherScore = wx
          ? Math.max(25, Math.min(100, Math.round(95 - (wx.rainMm || 0) * 12 - Math.max(0, (wx.windKmh || 0) - 25))))
          : 78;
        const difficultyScore = Math.max(30, Math.min(100, Math.round(96 - ascent / 45 - maxGrad * 1.4)));

        const walkingScore = Math.max(20, Math.min(100, Math.round(92 - Math.max(0, distKm - 15) * 1.5 - ascent / 35)));
        const cyclingScore = Math.max(25, Math.min(100, Math.round(90 - Math.max(0, distKm - 80) * 0.6 - maxGrad * 2.2)));
        const motorhomeScore = Math.max(25, Math.min(100, Math.round(
          92 -
          Math.max(0, maxGrad - 9) * 4.5 -
          Math.max(0, (vehicleProfile?.lengthM || 7) - 7.5) * 5 -
          (wx && wx.gustKmh > 50 ? 15 : 0)
        )));
        const photographyScore = Math.max(40, Math.min(100, Math.round(70 + Math.min(20, wpCount * 3) + (wx && wx.visibilityKm >= 8 ? 10 : 0))));

        const modeWeightMap = {
          walking: walkingScore,
          cycling: cyclingScore,
          mtb: cyclingScore,
          horse: difficultyScore,
          driving: distanceScore,
          motorhome: motorhomeScore
        };
        const activeModeScore = modeWeightMap[mode] ?? motorhomeScore;
        const overall = Math.round(
          distanceScore * 0.14 +
          scenicScore * 0.18 +
          weatherScore * 0.16 +
          difficultyScore * 0.14 +
          photographyScore * 0.12 +
          activeModeScore * 0.26
        );

        let label = 'Good';
        if (overall >= 90) label = 'Outstanding';
        else if (overall >= 78) label = 'Very Good';
        else if (overall >= 60) label = 'Moderate';
        else label = 'Challenging';

        return {
          distanceScore,
          scenicScore,
          weatherScore,
          difficultyScore,
          walkingScore,
          cyclingScore,
          motorhomeScore,
          photographyScore,
          overall,
          label
        };
      }

      return { scoreRoute };
    })();

    /* =========================================================================
       MOTORHOME ENGINE (VEHICLE PROFILE + OVERNIGHT / SERVICES / FACILITIES)
       ========================================================================= */
    const MotorhomeEngine = (() => {
      function updateVehicleProfile(patch) {
        const st = AppState.getState();
        const next = {
          ...st.vehicleProfile,
          heightM: Number(patch.heightM ?? st.vehicleProfile.heightM) || 3.0,
          lengthM: Number(patch.lengthM ?? st.vehicleProfile.lengthM) || 7.0,
          widthM: Number(patch.widthM ?? st.vehicleProfile.widthM) || 2.3,
          weightKg: Number(patch.weightKg ?? st.vehicleProfile.weightKg) || 3500,
          name: GeoUtils.sanitizeText(patch.name ?? st.vehicleProfile.name, 60)
        };
        AppState.update({ vehicleProfile: next }, 'vehicle:updated');
        AppState.persistPreferences();
        return next;
      }

      function classifyMotorhomePoi(poi) {
        const t = poi.tags || {};
        const tagsMatched = [];
        if (t.tourism === 'caravan_site' && t.caravan_site === 'aire') tagsMatched.push('aire');
        if (t.tourism === 'caravan_site') tagsMatched.push('caravan_site');
        if (t.tourism === 'camp_site') tagsMatched.push('camp_site');
        if (t.wildcamping === 'yes' || t.camping === 'yes') tagsMatched.push('wild_camping');
        if (t.amenity === 'drinking_water' || t.water_supply === 'yes') tagsMatched.push('water');
        if (t.amenity === 'sanitary_dump_station' || t.grey_water === 'yes') tagsMatched.push('waste');
        if (t['fuel:lpg'] === 'yes') tagsMatched.push('lpg');
        if (t.amenity === 'fuel') tagsMatched.push('fuel');
        if (t.amenity === 'charging_station') tagsMatched.push('ev');
        if (t.shower === 'yes') tagsMatched.push('showers');
        if (t.laundry === 'yes') tagsMatched.push('laundry');
        if (t.shop === 'supermarket') tagsMatched.push('supermarket');
        if (t.shop === 'car_repair') tagsMatched.push('repairs');
        if (tagsMatched.length === 0 && poi.isMotorhome) tagsMatched.push('camp_site');
        return tagsMatched;
      }

      function assessVehicleFit(poi, vehicle) {
        const t = poi.tags || {};
        const maxHeight = parseFloat(t.maxheight);
        const maxLength = parseFloat(t.maxlength);
        const maxWeight = parseFloat(t.maxweight);
        if (Number.isFinite(maxHeight) && vehicle.heightM > maxHeight) return { ok: false, reason: `Height ${vehicle.heightM}m > ${maxHeight}m` };
        if (Number.isFinite(maxLength) && vehicle.lengthM > maxLength) return { ok: false, reason: `Length ${vehicle.lengthM}m > ${maxLength}m` };
        if (Number.isFinite(maxWeight) && vehicle.weightKg / 1000 > maxWeight) return { ok: false, reason: `Weight ${(vehicle.weightKg / 1000).toFixed(1)}t > ${maxWeight}t` };
        return { ok: true, reason: 'Fits vehicle profile' };
      }

      return { updateVehicleProfile, classifyMotorhomePoi, assessVehicleFit };
    })();

    /* =========================================================================
       COLLECTIONS ENGINE (MASTER USER STRUCTURE: CREATE, DUPLICATE, RENAME, DELETE, EXPORT, SHARE)
       ========================================================================= */
    const CollectionsEngine = (() => {
      async function loadAll() {
        let cols = await StorageEngine.idbGetAll('collections');
        if (!cols || cols.length === 0) {
          const starter = {
            id: `col_${Date.now()}`,
            name: 'Scottish Highlands & Motorhome Loop',
            updatedAt: new Date().toISOString(),
            items: {
              routes: [],
              gpxFiles: [],
              events: [],
              pois: [],
              waypoints: [],
              nationalParks: [{ name: 'Loch Lomond & The Trossachs National Park', notes: 'Scenic highland gateway' }],
              motorhomeStops: [],
              notes: ['Remember to check fresh water & waste points before overnighting.']
            }
          };
          await StorageEngine.idbPut('collections', starter);
          cols = [starter];
        }
        AppState.update({ collections: cols }, 'collections:updated');
        return cols;
      }

      async function createCollection(name) {
        const clean = GeoUtils.sanitizeText(name, 80) || 'New Collection';
        const col = {
          id: `col_${Date.now()}_${Math.random().toString(36).slice(2, 6)}`,
          name: clean,
          updatedAt: new Date().toISOString(),
          items: {
            routes: [],
            gpxFiles: [],
            events: [],
            pois: [],
            waypoints: [],
            nationalParks: [],
            motorhomeStops: [],
            notes: []
          }
        };
        await StorageEngine.idbPut('collections', col);
        return loadAll();
      }

      async function renameCollection(id, newName) {
        const col = await StorageEngine.idbGet('collections', id);
        if (!col) return;
        col.name = GeoUtils.sanitizeText(newName, 80) || col.name;
        col.updatedAt = new Date().toISOString();
        await StorageEngine.idbPut('collections', col);
        return loadAll();
      }

      async function duplicateCollection(id) {
        const col = await StorageEngine.idbGet('collections', id);
        if (!col) return;
        const copy = JSON.parse(JSON.stringify(col));
        copy.id = `col_${Date.now()}_${Math.random().toString(36).slice(2, 6)}`;
        copy.name = `${col.name} (Copy)`;
        copy.updatedAt = new Date().toISOString();
        await StorageEngine.idbPut('collections', copy);
        return loadAll();
      }

      async function deleteCollection(id) {
        await StorageEngine.idbDelete('collections', id);
        return loadAll();
      }

      async function addItemToCollection(collectionId, bucket, item) {
        const col = await StorageEngine.idbGet('collections', collectionId);
        if (!col) return;
        if (!Array.isArray(col.items[bucket])) col.items[bucket] = [];
        col.items[bucket].push(item);
        col.updatedAt = new Date().toISOString();
        await StorageEngine.idbPut('collections', col);
        return loadAll();
      }

      function buildShareSummary(col) {
        const c = col.items || {};
        const lines = [
          `Collection: ${col.name}`,
          `Updated: ${col.updatedAt}`,
          `POIs (${(c.pois || []).length}): ${(c.pois || []).map((p) => p.name).join(', ') || 'None'}`,
          `Motorhome Stops (${(c.motorhomeStops || []).length}): ${(c.motorhomeStops || []).map((m) => m.name).join(', ') || 'None'}`,
          `Routes (${(c.routes || []).length}): ${(c.routes || []).map((r) => r.name).join(', ') || 'None'}`,
          `GPX (${(c.gpxFiles || []).length}): ${(c.gpxFiles || []).map((g) => g.name).join(', ') || 'None'}`,
          `Events (${(c.events || []).length}): ${(c.events || []).map((e) => e.title || e.name).join(', ') || 'None'}`,
          `Waypoints (${(c.waypoints || []).length}): ${(c.waypoints || []).map((w) => w.name).join(', ') || 'None'}`,
          `National Parks (${(c.nationalParks || []).length}): ${(c.nationalParks || []).map((n) => n.name).join(', ') || 'None'}`,
          `Notes (${(c.notes || []).length}): ${(c.notes || []).join(' | ') || 'None'}`
        ];
        return lines.join('\n');
      }

      return {
        loadAll,
        createCollection,
        renameCollection,
        duplicateCollection,
        deleteCollection,
        addItemToCollection,
        buildShareSummary
      };
    })();

    /* =========================================================================
       NAVIGATION ENGINE (GPS TRACKING, TURN-BY-TURN, VOICE + VISUAL FALLBACK,
       OFF-ROUTE DETECTION, RECALCULATION, ROUTE RECORDING, OFFLINE TIER 1/2)
       ========================================================================= */
    const NavigationEngine = (() => {
      let watchId = null;

      function speak(text) {
        if (!text) return;
        try {
          if ('speechSynthesis' in window) {
            window.speechSynthesis.cancel();
            const utter = new SpeechSynthesisUtterance(text);
            utter.rate = 1.0;
            window.speechSynthesis.speak(utter);
          }
        } catch {
          // Graceful visual fallback handled by UI state
        }
      }

      function startNavigation(mode = AppState.getState().travelMode) {
        const st = AppState.getState();
        const navState = {
          ...st.navigation,
          active: true,
          mode,
          currentStepIndex: 0,
          offRouteMeters: 0,
          recordedTrack: st.navigation.recordedTrack || []
        };
        AppState.update({ navigation: navState, travelMode: mode }, 'nav:started');

        if (st.route.instructions?.[0]) {
          const msg = st.route.instructions[0].text;
          speak(msg);
          showToast(`Nav: ${msg}`, 'info');
        }

        if ('geolocation' in navigator) {
          if (watchId !== null) navigator.geolocation.clearWatch(watchId);
          watchId = navigator.geolocation.watchPosition(
            (pos) => handlePositionUpdate(pos.coords.latitude, pos.coords.longitude, pos.coords.accuracy),
            () => showToast('GPS signal unavailable — using manual/cached position', 'warn'),
            { enableHighAccuracy: true, maximumAge: 3000, timeout: 10000 }
          );
        } else {
          showToast('Geolocation not supported — visual step mode active', 'warn');
        }
      }

      async function handlePositionUpdate(lat, lon, accuracy = 15) {
        const st = AppState.getState();
        AppState.update({
          currentPosition: { lat, lon, accuracy, timestamp: Date.now() }
        });
        MapEngine.setUserLocation(lat, lon, accuracy);

        if (!st.navigation.active) return;

        const recordedTrack = [...st.navigation.recordedTrack, { lat, lon, ts: Date.now() }];
        const activePath = st.route.geometry?.length > 1
          ? st.route.geometry
          : (st.route.waypoints || []);

        let offRouteMeters = 0;
        let nextStepIdx = st.navigation.currentStepIndex;

        if (activePath.length > 1) {
          offRouteMeters = Math.round(GeoUtils.distanceToPolylineMeters(lat, lon, activePath));
        }

        const steps = st.route.instructions || [];
        if (steps.length > 0) {
          let closestIdx = nextStepIdx;
          let minD = Infinity;
          for (let i = nextStepIdx; i < steps.length; i++) {
            const d = GeoUtils.haversineMeters(lat, lon, steps[i].lat, steps[i].lon);
            if (d < minD) { minD = d; closestIdx = i; }
          }
          if (minD < 45 && closestIdx + 1 < steps.length) {
            closestIdx += 1;
          }
          nextStepIdx = closestIdx;
          const stepText = steps[nextStepIdx]?.text || '';
          const stepKey = `${nextStepIdx}:${stepText}`;
          if (stepText && stepKey !== st.navigation.lastAnnouncedKey) {
            speak(stepText);
            AppState.update({
              navigation: { ...st.navigation, currentStepIndex: nextStepIdx, offRouteMeters, recordedTrack, lastAnnouncedKey: stepKey }
            }, 'nav:step');
          } else {
            AppState.update({
              navigation: { ...st.navigation, currentStepIndex: nextStepIdx, offRouteMeters, recordedTrack }
            }, 'nav:tick');
          }
        } else {
          AppState.update({
            navigation: { ...st.navigation, offRouteMeters, recordedTrack }
          }, 'nav:tick');
        }

        // Off-route recalculation (online recalculates route; offline falls back to cached instructions / track following)
        if (offRouteMeters > 85 && st.route.waypoints.length >= 2) {
          if (navigator.onLine) {
            showToast(`Off route (${offRouteMeters}m) — recalculating...`, 'warn');
            const dest = st.route.waypoints[st.route.waypoints.length - 1];
            const newWps = [
              { id: 'wp_curr', name: 'Current Position', lat, lon, type: 'gps' },
              dest
            ];
            await RouteEngine.computeRoute(newWps);
          } else {
            showToast(`Off route (${offRouteMeters}m) — offline mode: following cached track & instructions`, 'warn');
          }
        }
      }

      async function stopNavigationAndSaveRecording() {
        if (watchId !== null && 'geolocation' in navigator) {
          navigator.geolocation.clearWatch(watchId);
          watchId = null;
        }
        const st = AppState.getState();
        const track = st.navigation.recordedTrack || [];
        let savedGpx = null;
        if (track.length >= 2) {
          const xml = GPXEngine.generateGpxXml(`Recorded Navigation ${new Date().toLocaleDateString()}`, track, []);
          savedGpx = await GPXEngine.importGpxText(xml, `NavRecording_${Date.now()}.gpx`);
        }
        AppState.update({
          navigation: { ...st.navigation, active: false, recordedTrack: [] }
        }, 'nav:stopped');
        return savedGpx;
      }

      return { startNavigation, handlePositionUpdate, stopNavigationAndSaveRecording, speak };
    })();

    /* =========================================================================
       OFFLINE MAP & CACHE ENGINE (INDEXEDDB + CACHE STORAGE + 30-DAY REGIONS)
       ========================================================================= */
    const OfflineEngine = (() => {
      function latLonToTile(lat, lon, z) {
        const n = 2 ** z;
        const x = Math.floor(((lon + 180) / 360) * n);
        const latRad = (lat * Math.PI) / 180;
        const y = Math.floor(((1 - Math.log(Math.tan(latRad) + 1 / Math.cos(latRad)) / Math.PI) / 2) * n);
        return { x, y, z };
      }

      async function downloadOfflineArea(name, lat, lon, radiusKm = 10) {
        const cleanName = GeoUtils.sanitizeText(name, 80) || `Area (${lat.toFixed(2)}, ${lon.toFixed(2)})`;
        const z = radiusKm <= 10 ? 12 : radiusKm <= 25 ? 11 : 10;
        const centerTile = latLonToTile(lat, lon, z);
        const span = radiusKm <= 10 ? 1 : 2;
        const tileUrls = [];

        for (let dx = -span; dx <= span; dx++) {
          for (let dy = -span; dy <= span; dy++) {
            const x = centerTile.x + dx;
            const y = centerTile.y + dy;
            tileUrls.push(`https://tile.openstreetmap.org/${z}/${x}/${y}.png`);
          }
        }

        let cachedTiles = 0;
        if ('caches' in window) {
          const cache = await caches.open('gelv2-offline-tiles-v1');
          for (const url of tileUrls) {
            try {
              const resp = await GeoUtils.fetchWithTimeout(url, { mode: 'cors' }, 7000);
              if (resp && resp.ok) {
                await cache.put(url, resp);
                cachedTiles++;
              }
            } catch {
              // Continue caching remaining tiles
            }
          }
        }

        // Also cache nearby POIs & active route
        let nearbyPois = [];
        try {
          const res = await OverpassEngine.queryPois(lat, lon, Math.min(radiusKm * 1000, 50000), { includeMotorhome: true });
          nearbyPois = res.pois || [];
        } catch {
          nearbyPois = AppState.getState().pois || [];
        }

        const st = AppState.getState();
        const regionRecord = {
          id: `off_${Date.now()}`,
          name: cleanName,
          lat,
          lon,
          radiusKm,
          zoom: z,
          cachedTiles,
          totalTilesAttempted: tileUrls.length,
          poisCount: nearbyPois.length,
          routeSnapshot: st.route,
          gpxSnapshot: st.gpxItems,
          createdAt: Date.now(),
          expiresAt: Date.now() + APP_CONFIG.cacheTtlMs.offlineMaps
        };

        await StorageEngine.idbPut('offlineAreas', regionRecord);
        const all = await StorageEngine.idbGetAll('offlineAreas');
        AppState.update({ offlineAreas: all }, 'offline:updated');
        return regionRecord;
      }

      async function loadOfflineAreas() {
        const all = await StorageEngine.idbGetAll('offlineAreas');
        const valid = all.filter((a) => !a.expiresAt || a.expiresAt > Date.now());
        AppState.update({ offlineAreas: valid }, 'offline:updated');
        return valid;
      }

      async function deleteOfflineArea(id) {
        await StorageEngine.idbDelete('offlineAreas', id);
        return loadOfflineAreas();
      }

      return { downloadOfflineArea, loadOfflineAreas, deleteOfflineArea };
    })();
