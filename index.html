<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#0f172a" />
  <meta name="description" content="Global Explorer Lite V2 — OpenStreetMap travel discovery, motorhome & outdoor route planner, GPX manager, weather & elevation intelligence, and offline PWA companion." />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <title>Global Explorer Lite V2</title>
  <link rel="manifest" href="./manifest.json" />
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" crossorigin="" />
  <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.css" crossorigin="" />
  <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.Default.css" crossorigin="" />
  <style>
    /* =========================================================================
       GLOBAL EXPLORER LITE V2 — DESIGN SYSTEM & RESPONSIVE MOBILE-FIRST UI
       ========================================================================= */
    :root {
      --bg-app: #090d16;
      --bg-panel: rgba(15, 23, 42, 0.94);
      --bg-card: #131c31;
      --bg-input: #0b1120;
      --border: rgba(148, 163, 184, 0.18);
      --border-strong: rgba(148, 163, 184, 0.34);
      --text: #f1f5f9;
      --text-muted: #94a3b8;
      --accent: #38bdf8;
      --accent-strong: #0284c7;
      --accent-soft: rgba(56, 189, 248, 0.14);
      --ok: #22c55e;
      --warn: #f59e0b;
      --err: #ef4444;
      --radius-sm: 8px;
      --radius-md: 12px;
      --radius-lg: 16px;
      --shadow: 0 10px 30px rgba(0, 0, 0, 0.45);
      --topbar-h: 58px;
      --bottombar-h: 62px;
      --drawer-w: min(440px, 100vw);
      --font-sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Inter, Helvetica, Arial, sans-serif;
      --font-mono: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
    }

    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: var(--bg-app);
      color: var(--text);
      font-family: var(--font-sans);
      font-size: 14px;
      line-height: 1.45;
    }

    #app {
      position: relative;
      width: 100%;
      height: 100dvh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    /* Top Bar */
    .topbar {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      height: var(--topbar-h);
      z-index: 900;
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 8px 12px;
      padding-top: calc(8px + env(safe-area-inset-top));
      height: calc(var(--topbar-h) + env(safe-area-inset-top));
      background: var(--bg-panel);
      backdrop-filter: blur(14px);
      border-bottom: 1px solid var(--border);
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 8px;
      font-weight: 700;
      font-size: 14px;
      letter-spacing: 0.02em;
      white-space: nowrap;
    }

    .brand-badge {
      background: linear-gradient(135deg, #0284c7, #22c55e);
      color: #fff;
      font-size: 10px;
      font-weight: 800;
      padding: 2px 6px;
      border-radius: 999px;
    }

    .search-box {
      flex: 1;
      min-width: 110px;
      display: flex;
      align-items: center;
      background: var(--bg-input);
      border: 1px solid var(--border);
      border-radius: 999px;
      padding: 4px 10px;
      gap: 6px;
    }

    .search-box input {
      flex: 1;
      min-width: 0;
      background: transparent;
      border: none;
      color: var(--text);
      font-size: 13px;
      outline: none;
    }

    .search-box input::placeholder { color: var(--text-muted); }

    .icon-btn {
      appearance: none;
      background: var(--bg-card);
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      padding: 6px 9px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 5px;
      white-space: nowrap;
      transition: background 0.15s, border-color 0.15s, transform 0.1s;
    }

    .icon-btn:hover { border-color: var(--border-strong); background: #1a2642; }
    .icon-btn:active { transform: scale(0.97); }
    .icon-btn.primary { background: var(--accent-strong); border-color: var(--accent); color: #fff; }
    .icon-btn.primary:hover { background: #0369a1; }
    .icon-btn.danger { background: rgba(239, 68, 68, 0.16); border-color: rgba(239, 68, 68, 0.45); color: #fca5a5; }
    .icon-btn.active { background: var(--accent-soft); border-color: var(--accent); color: var(--accent); }

    .status-pill {
      font-size: 11px;
      font-weight: 600;
      padding: 3px 8px;
      border-radius: 999px;
      border: 1px solid var(--border);
      background: var(--bg-card);
      white-space: nowrap;
    }

    .status-pill.online { color: var(--ok); border-color: rgba(34, 197, 94, 0.35); }
    .status-pill.offline { color: var(--warn); border-color: rgba(245, 158, 11, 0.45); }

    /* Map Canvas */
    #map {
      position: absolute;
      top: calc(var(--topbar-h) + env(safe-area-inset-top));
      bottom: calc(var(--bottombar-h) + env(safe-area-inset-bottom));
      left: 0;
      right: 0;
      z-index: 1;
      background: #0b1322;
    }

    .leaflet-container { font-family: var(--font-sans); background: #0b1322; }
    .leaflet-control-attribution {
      background: rgba(15, 23, 42, 0.85) !important;
      color: #cbd5e1 !important;
      font-size: 10px !important;
    }
    .leaflet-control-attribution a { color: #7dd3fc !important; }
    .leaflet-popup-content-wrapper, .leaflet-popup-tip {
      background: var(--bg-panel);
      color: var(--text);
      border: 1px solid var(--border);
    }

    /* Floating Scale & Quick HUD */
    .map-hud {
      position: fixed;
      top: calc(var(--topbar-h) + env(safe-area-inset-top) + 10px);
      right: 10px;
      z-index: 650;
      display: flex;
      flex-direction: column;
      gap: 6px;
      max-width: calc(100vw - 20px);
    }

    .hud-chip {
      background: var(--bg-panel);
      backdrop-filter: blur(12px);
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      padding: 6px 10px;
      box-shadow: var(--shadow);
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 12px;
    }

    /* Workspace Drawer / Sheet */
    .workspace {
      position: fixed;
      top: calc(var(--topbar-h) + env(safe-area-inset-top));
      left: 0;
      width: var(--drawer-w);
      bottom: calc(var(--bottombar-h) + env(safe-area-inset-bottom));
      z-index: 800;
      background: var(--bg-panel);
      backdrop-filter: blur(16px);
      border-right: 1px solid var(--border);
      box-shadow: var(--shadow);
      display: flex;
      flex-direction: column;
      transform: translateX(-102%);
      transition: transform 0.24s cubic-bezier(0.22, 1, 0.36, 1);
    }

    .workspace.open { transform: translateX(0); }

    @media (max-width: 768px) {
      .workspace {
        top: auto;
        left: 0;
        right: 0;
        width: 100%;
        height: 70dvh;
        bottom: calc(var(--bottombar-h) + env(safe-area-inset-bottom));
        border-right: none;
        border-top: 1px solid var(--border);
        border-radius: var(--radius-lg) var(--radius-lg) 0 0;
        transform: translateY(105%);
      }
      .workspace.open { transform: translateY(0); }
      .brand-title { display: none; }
    }

    .workspace-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 14px;
      border-bottom: 1px solid var(--border);
      gap: 8px;
    }

    .workspace-title {
      font-weight: 700;
      font-size: 15px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .workspace-body {
      flex: 1;
      overflow-y: auto;
      padding: 12px 14px 20px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    /* Bottom Navigation Bar */
    .bottombar {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      height: calc(var(--bottombar-h) + env(safe-area-inset-bottom));
      padding-bottom: env(safe-area-inset-bottom);
      z-index: 900;
      display: flex;
      align-items: stretch;
      background: var(--bg-panel);
      backdrop-filter: blur(14px);
      border-top: 1px solid var(--border);
      overflow-x: auto;
      scrollbar-width: none;
    }

    .bottombar::-webkit-scrollbar { display: none; }

    .nav-tab {
      flex: 1 0 auto;
      min-width: 68px;
      appearance: none;
      background: transparent;
      border: none;
      color: var(--text-muted);
      font-family: var(--font-sans);
      font-size: 10px;
      font-weight: 600;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 3px;
      cursor: pointer;
      padding: 4px 6px;
      border-top: 2px solid transparent;
    }

    .nav-tab.active {
      color: var(--accent);
      border-top-color: var(--accent);
      background: rgba(56, 189, 248, 0.06);
    }

    .nav-icon { font-size: 16px; line-height: 1; }

    /* Cards, Forms & Lists */
    .card {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      padding: 12px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .card-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      font-weight: 700;
      font-size: 13px;
    }

    .muted { color: var(--text-muted); font-size: 12px; }
    .mono { font-family: var(--font-mono); font-size: 12px; }

    .row { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
    .grid-2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
    .grid-3 { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }

    label.field {
      display: flex;
      flex-direction: column;
      gap: 4px;
      font-size: 11px;
      font-weight: 600;
      color: var(--text-muted);
    }

    input[type="text"],
    input[type="number"],
    select,
    textarea {
      width: 100%;
      background: var(--bg-input);
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      padding: 7px 9px;
      font-size: 12px;
      font-family: var(--font-sans);
      outline: none;
    }

    input:focus, select:focus, textarea:focus { border-color: var(--accent); }

    textarea { min-height: 96px; resize: vertical; font-family: var(--font-mono); font-size: 11px; }

    .chip-group { display: flex; flex-wrap: wrap; gap: 6px; }
    .chip {
      appearance: none;
      background: var(--bg-input);
      color: var(--text-muted);
      border: 1px solid var(--border);
      border-radius: 999px;
      padding: 4px 10px;
      font-size: 11px;
      font-weight: 600;
      cursor: pointer;
    }
    .chip.active {
      background: var(--accent-soft);
      color: var(--accent);
      border-color: var(--accent);
    }

    .list-item {
      background: var(--bg-input);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      padding: 9px 10px;
      display: flex;
      flex-direction: column;
      gap: 5px;
    }

    .list-item-title { font-weight: 700; font-size: 13px; }

    .score-badge {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      padding: 3px 8px;
      border-radius: 999px;
      font-weight: 700;
      font-size: 12px;
      background: rgba(34, 197, 94, 0.16);
      color: #86efac;
      border: 1px solid rgba(34, 197, 94, 0.35);
    }

    .toast-container {
      position: fixed;
      top: calc(var(--topbar-h) + env(safe-area-inset-top) + 10px);
      left: 50%;
      transform: translateX(-50%);
      z-index: 1200;
      display: flex;
      flex-direction: column;
      gap: 6px;
      pointer-events: none;
      width: min(92vw, 420px);
    }

    .toast {
      background: var(--bg-panel);
      border: 1px solid var(--border-strong);
      border-left: 4px solid var(--accent);
      border-radius: var(--radius-sm);
      padding: 9px 12px;
      font-size: 12px;
      box-shadow: var(--shadow);
      pointer-events: auto;
    }

    .toast.error { border-left-color: var(--err); }
    .toast.warn { border-left-color: var(--warn); }
    .toast.success { border-left-color: var(--ok); }

    .lang-stack { display: flex; flex-direction: column; gap: 1px; }
    .lang-primary { font-weight: 700; font-size: 13px; }
    .lang-secondary { font-size: 11px; color: var(--text-muted); }

    .elevation-svg {
      width: 100%;
      height: 110px;
      background: var(--bg-input);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      display: block;
    }

    .nav-banner {
      background: linear-gradient(135deg, rgba(2, 132, 199, 0.25), rgba(34, 197, 94, 0.18));
      border: 1px solid rgba(56, 189, 248, 0.45);
      border-radius: var(--radius-md);
      padding: 12px;
    }

    .nav-maneuver { font-size: 16px; font-weight: 800; color: #fff; }
  </style>
</head>
<body>
  <div id="app">
    <header class="topbar" role="banner">
      <div class="brand">
        <span>🌍</span>
        <span class="brand-title">Global Explorer</span>
        <span class="brand-badge">LITE V2</span>
      </div>
      <div class="search-box">
        <span>🔎</span>
        <input id="globalSearchInput" type="text" placeholder="Search places, towns, peaks..." autocomplete="off" aria-label="Search locations" />
        <button id="globalSearchBtn" class="icon-btn primary" type="button" title="Search">Go</button>
      </div>
      <button id="gpsLocateBtn" class="icon-btn" type="button" title="Center on GPS">📍</button>
      <span id="networkStatusPill" class="status-pill online" title="Network status">Online</span>
      <button id="toggleWorkspaceBtn" class="icon-btn" type="button" title="Toggle Panel">☰</button>
    </header>

    <div class="map-hud" aria-label="Map Scale and Quick Controls">
      <div class="hud-chip">
        <span class="muted">Scale:</span>
        <select id="hudScaleSelect" aria-label="Explorer Scale">
          <option value="1">1km</option>
          <option value="5">5km</option>
          <option value="10">10km</option>
          <option value="25">25km</option>
          <option value="50">50km</option>
          <option value="100">100km</option>
          <option value="250">250km</option>
          <option value="500">500km</option>
          <option value="1000">1000km</option>
          <option value="2500">2500km</option>
          <option value="5000">5000km</option>
        </select>
        <button id="hudQueryOverpassBtn" class="icon-btn primary" type="button" title="Query Overpass POIs">POIs</button>
      </div>
    </div>

    <div id="map" role="region" aria-label="Interactive Map"></div>

    <aside id="workspace" class="workspace open" role="complementary" aria-label="Explorer Workspace">
      <div class="workspace-header">
        <div class="workspace-title" id="workspaceTitle">🧭 Discover & POIs</div>
        <div class="row">
          <button id="workspaceCloseBtn" class="icon-btn" type="button" aria-label="Close panel">✕</button>
        </div>
      </div>
      <div id="workspaceBody" class="workspace-body"></div>
    </aside>

    <nav class="bottombar" role="navigation" aria-label="Primary Sections">
      <button class="nav-tab active" data-tab="discover" type="button"><span class="nav-icon">🧭</span><span>Discover</span></button>
      <button class="nav-tab" data-tab="events" type="button"><span class="nav-icon">🎟️</span><span>Events</span></button>
      <button class="nav-tab" data-tab="trip" type="button"><span class="nav-icon">🗺️</span><span>Trip</span></button>
      <button class="nav-tab" data-tab="motorhome" type="button"><span class="nav-icon">🚐</span><span>Motorhome</span></button>
      <button class="nav-tab" data-tab="gpx" type="button"><span class="nav-icon">📈</span><span>GPX & Elev</span></button>
      <button class="nav-tab" data-tab="collections" type="button"><span class="nav-icon">📁</span><span>Collections</span></button>
      <button class="nav-tab" data-tab="nav" type="button"><span class="nav-icon">🧭</span><span>Navigate</span></button>
      <button class="nav-tab" data-tab="offline" type="button"><span class="nav-icon">💾</span><span>Offline</span></button>
      <button class="nav-tab" data-tab="ai" type="button"><span class="nav-icon">🤖</span><span>AI Hub</span></button>
      <button class="nav-tab" data-tab="settings" type="button"><span class="nav-icon">⚙️</span><span>Settings</span></button>
    </nav>

    <div id="toastContainer" class="toast-container" aria-live="polite"></div>
  </div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" crossorigin=""></script>
  <script src="https://unpkg.com/leaflet.markercluster@1.5.3/dist/leaflet.markercluster.js" crossorigin=""></script>

  <script>
    /* =========================================================================
       CONFIGURATION BLOCK
       ========================================================================= */
    const APP_CONFIG = Object.freeze({
      appName: 'Global Explorer Lite V2',
      version: '2.0.0',
      defaultCenter: [56.4907, -4.2026],
      defaultZoom: 7,
      maxRenderedMarkers: 800,
      maxCachedPois: 6000,
      maxRouteWaypoints: 150,
      maxGpxPoints: 25000,
      requestTimeoutMs: 14000,
      retryAttempts: 2,
      cacheTtlMs: Object.freeze({
        weather: 60 * 60 * 1000,          // 1 Hour
        overpass: 24 * 60 * 60 * 1000,        // 24 Hours
        elevation: 24 * 60 * 60 * 1000,       // 24 Hours
        offlineMaps: 30 * 24 * 60 * 60 * 1000 // 30 Days
      }),
      overpassEndpoints: [
        'https://overpass-api.de/api/interpreter',
        'https://overpass.kumi.systems/api/interpreter',
        'https://lz4.overpass-api.de/api/interpreter'
      ],
      nominatimEndpoint: 'https://nominatim.openstreetmap.org/search',
      openMeteoEndpoint: 'https://api.open-meteo.com/v1/forecast',
      openTopoDataEndpoint: 'https://api.opentopodata.org/v1/srtm90m',
      openElevationEndpoint: 'https://api.open-elevation.com/api/v1/lookup',
      osrmEndpoint: 'https://router.project-osrm.org/route/v1',
      w3wConvertTo3wa: 'https://api.what3words.com/v3/convert-to-3wa',
      w3wConvertToCoords: 'https://api.what3words.com/v3/convert-to-coordinates',
      aiProviders: ['Grok', 'Copilot', 'Claude', 'ChatGPT', 'Gemini', 'DeepSeek'],
      explorerScales: [1, 5, 10, 25, 50, 100, 250, 500, 1000, 2500, 5000],
      travelModes: ['walking', 'cycling', 'mtb', 'horse', 'driving', 'motorhome'],
      highlightCategories: [
        'Must See Highlights',
        'Hidden Gems',
        'Scenic Routes',
        'Photography Locations',
        'Food and Drink',
        'Viewpoints',
        'Family Activities',
        'Bad Weather Alternatives'
      ],
      motorhomeFilters: Object.freeze({
        overnight: ['aire', 'camp_site', 'caravan_site', 'wild_camping'],
        services: ['water', 'waste', 'lpg', 'fuel', 'ev'],
        facilities: ['showers', 'laundry', 'supermarket', 'repairs']
      })
    });

    /* =========================================================================
       UTILITIES: SANITISATION, NETWORK RETRY/TIMEOUT, GEO MATH, DOM ESCAPE
       ========================================================================= */
    const GeoUtils = (() => {
      function escapeHtml(value) {
  return String(value ?? '')
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;')
    .replace(/'/g, '&#39;');
      }

      function sanitizeText(value, maxLen = 300) {
        return String(value ?? '').replace(/[\u0000-\u001F\u007F]/g, '').trim().slice(0, maxLen);
      }

      function toRad(deg) { return (deg * Math.PI) / 180; }
      function toDeg(rad) { return (rad * 180) / Math.PI; }

      function haversineMeters(lat1, lon1, lat2, lon2) {
        const R = 6371000;
        const dLat = toRad(lat2 - lat1);
        const dLon = toRad(lon2 - lon1);
        const a = Math.sin(dLat / 2) ** 2 +
                  Math.cos(toRad(lat1)) * Math.cos(toRad(lat2)) * Math.sin(dLon / 2) ** 2;
        return 2 * R * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
      }

      function calculatePathDistanceMeters(coords) {
        if (!Array.isArray(coords) || coords.length < 2) return 0;
        let total = 0;
        for (let i = 1; i < coords.length; i++) {
          total += haversineMeters(coords[i - 1].lat, coords[i - 1].lon, coords[i].lat, coords[i].lon);
        }
        return total;
      }

      function bearingDeg(lat1, lon1, lat2, lon2) {
        const y = Math.sin(toRad(lon2 - lon1)) * Math.cos(toRad(lat2));
        const x = Math.cos(toRad(lat1)) * Math.sin(toRad(lat2)) -
                  Math.sin(toRad(lat1)) * Math.cos(toRad(lat2)) * Math.cos(toRad(lon2 - lon1));
        return (toDeg(Math.atan2(y, x)) + 360) % 360;
      }

      function pointToSegmentDistanceMeters(pLat, pLon, aLat, aLon, bLat, bLon) {
        const latRef = toRad((aLat + bLat) / 2);
        const xScale = 111320 * Math.cos(latRef);
        const yScale = 110540;
        const px = (pLon - aLon) * xScale;
        const py = (pLat - aLat) * yScale;
        const vx = (bLon - aLon) * xScale;
        const vy = (bLat - aLat) * yScale;
        const lenSq = vx * vx + vy * vy;
        if (lenSq === 0) return Math.hypot(px, py);
        const t = Math.max(0, Math.min(1, (px * vx + py * vy) / lenSq));
        return Math.hypot(px - t * vx, py - t * vy);
      }

      function distanceToPolylineMeters(lat, lon, points) {
        if (!Array.isArray(points) || points.length === 0) return Infinity;
        if (points.length === 1) return haversineMeters(lat, lon, points[0].lat, points[0].lon);
        let minDist = Infinity;
        for (let i = 0; i < points.length - 1; i++) {
          const d = pointToSegmentDistanceMeters(lat, lon, points[i].lat, points[i].lon, points[i + 1].lat, points[i + 1].lon);
          if (d < minDist) minDist = d;
        }
        return minDist;
      }

      async function fetchWithTimeout(url, options = {}, timeoutMs = APP_CONFIG.requestTimeoutMs) {
        const controller = new AbortController();
        const timer = setTimeout(() => controller.abort(), timeoutMs);
        try {
          return await fetch(url, { ...options, signal: controller.signal });
        } finally {
          clearTimeout(timer);
        }
      }

      async function fetchWithRetry(url, options = {}, retries = APP_CONFIG.retryAttempts, timeoutMs = APP_CONFIG.requestTimeoutMs) {
        let lastErr;
        for (let attempt = 0; attempt <= retries; attempt++) {
          try {
            const res = await fetchWithTimeout(url, options, timeoutMs);
            if (!res.ok && res.status >= 500 && attempt < retries) {
              throw new Error(`HTTP ${res.status}`);
            }
            return res;
          } catch (err) {
            lastErr = err;
            if (attempt < retries) {
              await new Promise((r) => setTimeout(r, 350 * (attempt + 1)));
            }
          }
        }
        throw lastErr || new Error('Network request failed');
      }

      function debounce(fn, wait = 250) {
        let t;
        return (...args) => {
          clearTimeout(t);
          t = setTimeout(() => fn(...args), wait);
        };
      }

      return {
        escapeHtml,
        sanitizeText,
        haversineMeters,
        calculatePathDistanceMeters,
        bearingDeg,
        distanceToPolylineMeters,
        fetchWithTimeout,
        fetchWithRetry,
        debounce
      };
    })();

    /* =========================================================================
       STORAGE LAYER: LOCALSTORAGE + INDEXEDDB + CACHE STORAGE
       ========================================================================= */
    const StorageEngine = (() => {
      const LS_PREFIX = 'gelv2_';
      const DB_NAME = 'GlobalExplorerLiteV2_DB';
      const DB_VERSION = 2;
      let dbInstance = null;

      function lsGet(key, fallback = null) {
        try {
          const raw = localStorage.getItem(LS_PREFIX + key);
          return raw ? JSON.parse(raw) : fallback;
        } catch {
          return fallback;
        }
      }

      function lsSet(key, value) {
        try {
          localStorage.setItem(LS_PREFIX + key, JSON.stringify(value));
          return true;
        } catch {
          return false;
        }
      }

      function openDb() {
        if (dbInstance) return Promise.resolve(dbInstance);
        return new Promise((resolve, reject) => {
          if (!('indexedDB' in window)) {
            reject(new Error('IndexedDB unavailable'));
            return;
          }
          const req = indexedDB.open(DB_NAME, DB_VERSION);
          req.onupgradeneeded = (event) => {
            const db = event.target.result;
            const stores = [
              'routes',
              'gpx',
              'collections',
              'pois',
              'weatherCache',
              'overpassCache',
              'elevationCache',
              'offlineAreas',
              'navigationData'
            ];
            for (const storeName of stores) {
              if (!db.objectStoreNames.contains(storeName)) {
                db.createObjectStore(storeName, { keyPath: 'id' });
              }
            }
          };
          req.onsuccess = () => {
            dbInstance = req.result;
            resolve(dbInstance);
          };
          req.onerror = () => reject(req.error || new Error('IndexedDB open failed'));
        });
      }

      async function idbPut(storeName, record) {
        const db = await openDb();
        return new Promise((resolve, reject) => {
          const tx = db.transaction(storeName, 'readwrite');
          tx.objectStore(storeName).put(record);
          tx.oncomplete = () => resolve(record);
          tx.onerror = () => reject(tx.error);
        });
      }

      async function idbBulkPut(storeName, records) {
        if (!Array.isArray(records) || records.length === 0) return;
        const db = await openDb();
        return new Promise((resolve, reject) => {
          const tx = db.transaction(storeName, 'readwrite');
          const store = tx.objectStore(storeName);
          for (const rec of records) store.put(rec);
          tx.oncomplete = () => resolve(records.length);
          tx.onerror = () => reject(tx.error);
        });
      }

      async function idbGet(storeName, id) {
        const db = await openDb();
        return new Promise((resolve, reject) => {
          const tx = db.transaction(storeName, 'readonly');
          const req = tx.objectStore(storeName).get(id);
          req.onsuccess = () => resolve(req.result || null);
          req.onerror = () => reject(req.error);
        });
      }

      async function idbGetAll(storeName) {
        const db = await openDb();
        return new Promise((resolve, reject) => {
          const tx = db.transaction(storeName, 'readonly');
          const req = tx.objectStore(storeName).getAll();
          req.onsuccess = () => resolve(req.result || []);
          req.onerror = () => reject(req.error);
        });
      }

      async function idbDelete(storeName, id) {
        const db = await openDb();
        return new Promise((resolve, reject) => {
          const tx = db.transaction(storeName, 'readwrite');
          tx.objectStore(storeName).delete(id);
          tx.oncomplete = () => resolve(true);
          tx.onerror = () => reject(tx.error);
        });
      }

      async function setTimedCache(storeName, id, payload, ttlMs) {
        const now = Date.now();
        return idbPut(storeName, {
          id,
          payload,
          cachedAt: now,
          expiresAt: ttlMs ? now + ttlMs : null
        });
      }

      async function getTimedCache(storeName, id) {
        const entry = await idbGet(storeName, id);
        if (!entry) return null;
        if (entry.expiresAt && Date.now() > entry.expiresAt) {
          return null;
        }
        return entry.payload;
      }

      return {
        lsGet,
        lsSet,
        openDb,
        idbPut,
        idbBulkPut,
        idbGet,
        idbGetAll,
        idbDelete,
        setTimedCache,
        getTimedCache
      };
    })();

        for (const fn of listeners) {
          try { fn(eventName, state, detail); } catch (e) { console.error(e); }
        }

      function update(patch, eventName = 'state:updated') {
        Object.assign(state, patch);
        emit(eventName, patch);

      function persistPreferences() {
        StorageEngine.lsSet('explorerScaleKm', state.explorerScaleKm);

        StorageEngine.lsSet('highlightCategory', state.highlightCategory);
        StorageEngine.lsSet('preferences', {
          preferredLanguage: state.selectedLanguages.preferred
        });
      }

      return { getState, subscribe, emit, update, persistPreferences };
    })();

    /* =========================================================================

    function showToast(message, type = 'info') {
