    /* =========================================================================
       WHAT3WORDS ENGINE (CONFIGURATION-DRIVEN, NEVER HARDCODED)
       ========================================================================= */
    const What3WordsEngine = (() => {
      function hasApiKey() {
        return Boolean((AppState.getState().w3wApiKey || '').trim());
      }

      async function coordsToW3W(lat, lon) {
        const key = (AppState.getState().w3wApiKey || '').trim();
        if (!key) throw new Error('What3Words API key not configured in Settings');
        const url = `${APP_CONFIG.w3wConvertTo3wa}?coordinates=${encodeURIComponent(`${lat},${lon}`)}&key=${encodeURIComponent(key)}`;
        const res = await GeoUtils.fetchWithRetry(url, {}, 1, 9000);
        const data = await res.json();
        if (!res.ok || data.error) throw new Error(data.error?.message || 'W3W lookup failed');
        return { words: data.words, country: data.country, nearestPlace: data.nearestPlace };
      }

      async function w3wToCoords(words) {
        const key = (AppState.getState().w3wApiKey || '').trim();
        if (!key) throw new Error('What3Words API key not configured in Settings');
        const cleanWords = GeoUtils.sanitizeText(words, 60).replace(/^\/+/, '');
        const url = `${APP_CONFIG.w3wConvertToCoords}?words=${encodeURIComponent(cleanWords)}&key=${encodeURIComponent(key)}`;
        const res = await GeoUtils.fetchWithRetry(url, {}, 1, 9000);
        const data = await res.json();
        if (!res.ok || data.error || !data.coordinates) throw new Error(data.error?.message || 'W3W coordinates lookup failed');
        return { lat: data.coordinates.lat, lon: data.coordinates.lng, words: data.words };
      }

      return { hasApiKey, coordsToW3W, w3wToCoords };
    })();

    /* =========================================================================
       EXPORT ENGINE (GPX, KML, GEOJSON, TXT, ROUTE REPORT, TRIP REPORT)
       ========================================================================= */
    const ExportEngine = (() => {
      function downloadFile(filename, content, mimeType = 'text/plain;charset=utf-8') {
        const blob = new Blob([content], { type: mimeType });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = filename;
        document.body.appendChild(a);
        a.click();
        a.remove();
        setTimeout(() => URL.revokeObjectURL(url), 1500);
      }

      function getActiveCoords() {
        const st = AppState.getState();
        if (st.route.geometry?.length > 1) return st.route.geometry;
        if (st.route.waypoints?.length > 0) return st.route.waypoints;
        if (st.gpxItems?.[0]?.points?.length > 0) return st.gpxItems[0].points;
        return [];
      }

      function exportGpx() {
        const st = AppState.getState();
        const xml = GPXEngine.generateGpxXml(st.route.name, getActiveCoords(), st.route.waypoints);
        downloadFile(`${slug(st.route.name)}.gpx`, xml, 'application/gpx+xml;charset=utf-8');
      }

      function exportKml() {
        const st = AppState.getState();
        const coords = getActiveCoords();
        const coordStr = coords.map((p) => `${p.lon},${p.lat},${p.ele || 0}`).join(' ');
        const placemarks = (st.route.waypoints || []).map((w) => `
    <Placemark>
      <name>${GeoUtils.escapeHtml(w.name)}</name>
      <Point><coordinates>${w.lon},${w.lat},0</coordinates></Point>
    </Placemark>`).join('');

        const kml = `<?xml version="1.0" encoding="UTF-8"?>
<kml xmlns="http://www.opengis.net/kml/2.2">
  <Document>
    <name>${GeoUtils.escapeHtml(st.route.name)}</name>
    <Placemark>
      <name>${GeoUtils.escapeHtml(st.route.name)} Track</name>
      <LineString><coordinates>${coordStr}</coordinates></LineString>
    </Placemark>${placemarks}
  </Document>
</kml>`;
        downloadFile(`${slug(st.route.name)}.kml`, kml, 'application/vnd.google-earth.kml+xml;charset=utf-8');
      }

      function exportGeoJson() {
        const st = AppState.getState();
        const coords = getActiveCoords();
        const features = [];
        if (coords.length > 1) {
          features.push({
            type: 'Feature',
            properties: { name: st.route.name, mode: st.travelMode, distanceMeters: st.route.distanceMeters },
            geometry: { type: 'LineString', coordinates: coords.map((p) => [p.lon, p.lat]) }
          });
        }
        for (const w of (st.route.waypoints || [])) {
          features.push({
            type: 'Feature',
            properties: { name: w.name, type: w.type || 'waypoint' },
            geometry: { type: 'Point', coordinates: [w.lon, w.lat] }
          });
        }
        const fc = { type: 'FeatureCollection', features };
        downloadFile(`${slug(st.route.name)}.geojson`, JSON.stringify(fc, null, 2), 'application/geo+json;charset=utf-8');
      }

      function exportTxt() {
        const st = AppState.getState();
        const lines = [
          `Title: ${st.route.name}`,
          `Mode: ${st.travelMode}`,
          `Distance: ${(st.route.distanceMeters / 1000).toFixed(2)} km`,
          `Waypoints:`,
          ...(st.route.waypoints || []).map((w, i) => `  ${i + 1}. ${w.name} (${w.lat.toFixed(5)}, ${w.lon.toFixed(5)})`),
          `Turn-by-Turn:`,
          ...(st.route.instructions || []).map((ins, i) => `  ${i + 1}. ${ins.text} (${ins.distanceMeters}m)`)
        ];
        downloadFile(`${slug(st.route.name)}.txt`, lines.join('\n'), 'text/plain;charset=utf-8');
      }

      function exportRouteReport() {
        const st = AppState.getState();
        const qual = RouteQualityEngine.scoreRoute(st.route, st.weatherData, st.elevationProfile, st.vehicleProfile, st.travelMode);
        const ele = st.elevationProfile;
        const report = [
          `GLOBAL EXPLORER LITE V2 — ROUTE REPORT`,
          `Generated: ${new Date().toISOString()}`,
          `Route Name: ${st.route.name}`,
          `Travel Mode: ${st.travelMode}`,
          `Distance: ${(st.route.distanceMeters / 1000).toFixed(2)} km | Est. Duration: ${Math.round(st.route.durationSeconds / 60)} min`,
          `Quality Score: ${qual.overall}/100 (${qual.label})`,
          `  - Distance: ${qual.distanceScore} | Scenic: ${qual.scenicScore} | Weather: ${qual.weatherScore} | Difficulty: ${qual.difficultyScore}`,
          `  - Walking: ${qual.walkingScore} | Cycling: ${qual.cyclingScore} | Motorhome: ${qual.motorhomeScore} | Photography: ${qual.photographyScore}`,
          ele ? `Elevation: Ascent +${ele.ascentM}m | Descent -${ele.descentM}m | Max Gradient ${ele.maxGradientPct}% | Difficulty ${ele.difficulty}` : 'Elevation: Not analysed',
          `Waypoints (${st.route.waypoints.length}):`,
          ...st.route.waypoints.map((w, i) => `  ${i + 1}. ${w.name} [${w.lat.toFixed(5)}, ${w.lon.toFixed(5)}]`)
        ].join('\n');
        downloadFile(`${slug(st.route.name)}_route_report.txt`, report, 'text/plain;charset=utf-8');
      }

      function exportTripReport() {
        const st = AppState.getState();
        const colSummary = st.collections.map((c) => CollectionsEngine.buildShareSummary(c)).join('\n\n---\n\n');
        const report = [
          `GLOBAL EXPLORER LITE V2 — TRIP REPORT`,
          `Generated: ${new Date().toISOString()}`,
          `Vehicle: ${st.vehicleProfile.name} (${st.vehicleProfile.heightM}m H, ${st.vehicleProfile.lengthM}m L, ${st.vehicleProfile.weightKg}kg)`,
          `Explorer Scale: ${st.explorerScaleKm}km`,
          `Active Route: ${st.route.name} (${(st.route.distanceMeters / 1000).toFixed(2)} km)`,
          ``,
          `COLLECTIONS`,
          colSummary || 'No collections saved'
        ].join('\n');
        downloadFile(`global_explorer_trip_report.txt`, report, 'text/plain;charset=utf-8');
      }

      function slug(str) {
        return (str || 'export').toLowerCase().replace(/[^a-z0-9]+/g, '_').replace(/^_|_$/g, '') || 'export';
      }

      return { downloadFile, exportGpx, exportKml, exportGeoJson, exportTxt, exportRouteReport, exportTripReport };
    })();

    const AppController = (() => {
      async function runOverpassQuery(motorhomeOnly = false) {
        const st = AppState.getState();
        const center = MapEngine.getCenter();
        const scaleCfg = ExplorerScaleEngine.getScaleConfig(st.explorerScaleKm);
        showToast(`Querying Overpass (${st.explorerScaleKm}km)...`, 'info');
        try {
          const res = await OverpassEngine.queryPois(center.lat, center.lon, scaleCfg.queryRadiusMeters, {
            includeMotorhome: motorhomeOnly || st.travelMode === 'motorhome' || st.selectedLayers.includes('motorhome'),
            motorhomeOnly,
            categories: st.selectedFilters.poiCategories
          });
          AppState.update({ pois: res.pois }, 'pois:updated');
          MapEngine.renderPois(res.pois);
          showToast(`Loaded ${res.pois.length} POIs${res.fromCache ? ' (cached)' : ''}`, 'success');
          UIRenderer.renderWorkspace();
        } catch (err) {
          showToast(`Overpass query issue: ${err.message}`, 'warn');
        }
      }

      async function runWeatherFetch(force = false) {
        const center = MapEngine.getCenter();
        try {
          const wx = await WeatherEngine.fetchWeather(center.lat, center.lon, force);
          showToast(`Weather: ${wx.current.tempC}°C, ${wx.current.condition}`, 'success');
          UIRenderer.renderWorkspace();
        } catch (err) {
          showToast(`Weather error: ${err.message}`, 'warn');
        }
      }

      async function runSearch() {
        const input = document.getElementById('globalSearchInput');
        const q = input?.value?.trim() || '';
        if (!q) return;
        showToast(`Searching "${q}"...`, 'info');
        try {
          const results = await OverpassEngine.searchLocations(q);
          if (results.length === 0) {
            showToast('No matching locations found', 'warn');
            return;
          }
          const top = results[0];
          MapEngine.setView(top.lat, top.lon, 11);
          showToast(`Found: ${top.name}`, 'success');
          await runWeatherFetch(false);
        } catch (err) {
          showToast(`Search failed: ${err.message}`, 'warn');
        }
      }

      function locateGpsOnce() {
        if (!('geolocation' in navigator)) {
          showToast('Geolocation not available in this browser', 'warn');
          return;
        }
        navigator.geolocation.getCurrentPosition(
          (pos) => {
            const { latitude: lat, longitude: lon, accuracy } = pos.coords;
            AppState.update({ currentPosition: { lat, lon, accuracy, timestamp: Date.now() } });
            MapEngine.setView(lat, lon, 13);
            MapEngine.setUserLocation(lat, lon, accuracy);
            showToast('Centered on GPS position', 'success');
          },
          () => showToast('Unable to retrieve GPS location', 'warn'),
          { enableHighAccuracy: true, timeout: 8000 }
        );
      }

      function bindEvents() {
        // Bottom nav tabs
        document.querySelectorAll('.nav-tab').forEach((tab) => {
          tab.addEventListener('click', () => UIRenderer.setActiveTab(tab.dataset.tab));
        });

        document.getElementById('toggleWorkspaceBtn')?.addEventListener('click', () => UIRenderer.toggleWorkspace());
        document.getElementById('workspaceCloseBtn')?.addEventListener('click', () => UIRenderer.toggleWorkspace(false));
        document.getElementById('globalSearchBtn')?.addEventListener('click', runSearch);
        document.getElementById('globalSearchInput')?.addEventListener('keydown', (e) => {
          if (e.key === 'Enter') runSearch();
        });
        document.getElementById('gpsLocateBtn')?.addEventListener('click', locateGpsOnce);

        document.getElementById('hudScaleSelect')?.addEventListener('change', (e) => {
          ExplorerScaleEngine.applyScale(Number(e.target.value), true);
          UIRenderer.renderWorkspace();
        });
        document.getElementById('hudQueryOverpassBtn')?.addEventListener('click', () => runOverpassQuery(false));

        // Map popup action delegation
        document.getElementById('map')?.addEventListener('click', async (e) => {
          const btn = e.target.closest('button[data-poi-action]');
          if (!btn) return;
          const action = btn.dataset.poiAction;
          const st = AppState.getState();
          const poi = st.pois.find((p) => p.id === btn.dataset.poiId);
          if (action === 'add-route' && poi) {
            await RouteEngine.addWaypoint(poi.lat, poi.lon, poi.name, poi.category);
            showToast(`Added "${poi.name}" to route`, 'success');
          } else if (action === 'save-col' && poi && st.collections[0]) {
            await CollectionsEngine.addItemToCollection(st.collections[0].id, 'pois', { id: poi.id, name: poi.name, lat: poi.lat, lon: poi.lon });
            showToast(`Saved "${poi.name}" to ${st.collections[0].name}`, 'success');
            UIRenderer.renderWorkspace();
          } else if (action === 'w3w') {
            try {
              const r = await What3WordsEngine.coordsToW3W(Number(btn.dataset.lat), Number(btn.dataset.lon));
              showToast(`What3Words: ///${r.words}`, 'success');
            } catch (err) {
              showToast(err.message, 'warn');
            }
          }
        });

        // Workspace delegated actions
        document.getElementById('workspaceBody')?.addEventListener('click', async (e) => {
          const btn = e.target.closest('button[data-action]');
          if (!btn) return;
          const action = btn.dataset.action;
          const st = AppState.getState();

          if (action === 'set-scale') {
            ExplorerScaleEngine.applyScale(Number(btn.dataset.scale), true);
            UIRenderer.renderWorkspace();
          } else if (action === 'query-overpass') {
            await runOverpassQuery(false);
          } else if (action === 'query-motorhome-pois') {
            await runOverpassQuery(true);
          } else if (action === 'fetch-weather') {
            await runWeatherFetch(true);
          } else if (action === 'toggle-layer') {
            const layer = btn.dataset.layer;
            const exists = st.selectedLayers.includes(layer);
            const next = exists ? st.selectedLayers.filter((x) => x !== layer) : [...st.selectedLayers, layer];
            AppState.update({ selectedLayers: next }, 'layers:changed');
            AppState.persistPreferences();
            MapEngine.syncLayersFromState();
            UIRenderer.renderWorkspace();
          } else if (action === 'toggle-poi-cat') {
            const cat = btn.dataset.cat;
            const cur = st.selectedFilters.poiCategories;
            const nextCats = cur.includes(cat) ? cur.filter((x) => x !== cat) : [...cur, cat];
            AppState.update({ selectedFilters: { ...st.selectedFilters, poiCategories: nextCats } });
            UIRenderer.renderWorkspace();
          } else if (action === 'toggle-mh-filter') {
            const mh = btn.dataset.mh;
            const cur = st.selectedFilters.motorhome;
            const nextMh = cur.includes(mh) ? cur.filter((x) => x !== mh) : [...cur, mh];
            AppState.update({ selectedFilters: { ...st.selectedFilters, motorhome: nextMh } });
            UIRenderer.renderWorkspace();
          } else if (action === 'focus-poi') {
            const poi = st.pois.find((p) => p.id === btn.dataset.poiId);
            if (poi) MapEngine.setView(poi.lat, poi.lon, 15);
          } else if (action === 'add-poi-route') {
            const poi = st.pois.find((p) => p.id === btn.dataset.poiId);
            if (poi) {
              await RouteEngine.addWaypoint(poi.lat, poi.lon, poi.name, poi.category);
              showToast(`Added "${poi.name}" to route`, 'success');
              UIRenderer.renderWorkspace();
            }
          } else if (action === 'save-poi-col' || action === 'save-mh-col') {
            const poi = st.pois.find((p) => p.id === btn.dataset.poiId);
            const targetCol = st.collections[0];
            if (poi && targetCol) {
              const bucket = action === 'save-mh-col' ? 'motorhomeStops' : 'pois';
              await CollectionsEngine.addItemToCollection(targetCol.id, bucket, { id: poi.id, name: poi.name, lat: poi.lat, lon: poi.lon });
              showToast(`Saved "${poi.name}" to "${targetCol.name}"`, 'success');
              UIRenderer.renderWorkspace();
            }
          } else if (action === 'add-center-wp') {
            const c = MapEngine.getCenter();
            await RouteEngine.addWaypoint(c.lat, c.lon, `Stop ${st.route.waypoints.length + 1}`, 'waypoint');
            UIRenderer.renderWorkspace();
          } else if (action === 'optimise-route') {
            await RouteEngine.optimiseWaypointsHeuristic();
            showToast('Route order optimised', 'success');
            UIRenderer.renderWorkspace();
          } else if (action === 'undo-route') {
            await RouteEngine.undo();
            UIRenderer.renderWorkspace();
          } else if (action === 'redo-route') {
            await RouteEngine.redo();
            UIRenderer.renderWorkspace();
          } else if (action === 'save-route') {
            const nameVal = document.getElementById('routeNameInput')?.value || st.route.name;
            const modeVal = document.getElementById('routeModeSelect')?.value || st.travelMode;
            AppState.update({ route: { ...st.route, name: nameVal }, travelMode: modeVal });
            await RouteEngine.saveRouteRecord(nameVal);
            showToast(`Saved route "${nameVal}"`, 'success');
          } else if (action === 'calc-route-elev' || action === 'analyse-route-elevation') {
            const coords = st.route.geometry?.length > 1 ? st.route.geometry : st.route.waypoints;
            if (!coords || coords.length < 2) {
              showToast('Add at least 2 route waypoints first', 'warn');
              return;
            }
            showToast('Fetching elevation profile...', 'info');
            try {
              await ElevationEngine.buildProfileForCoords(coords);
              UIRenderer.renderWorkspace();
              showToast('Elevation profile updated', 'success');
            } catch (err) {
              showToast(`Elevation error: ${err.message}`, 'warn');
            }
          } else if (action === 'wp-up') {
            const idx = Number(btn.dataset.idx);
            if (idx > 0) {
              const copy = [...st.route.waypoints];
              [copy[idx - 1], copy[idx]] = [copy[idx], copy[idx - 1]];
              AppState.update({ route: { ...st.route, waypoints: copy } });
              await RouteEngine.computeRoute(copy);
              UIRenderer.renderWorkspace();
            }
          } else if (action === 'wp-down') {
            const idx = Number(btn.dataset.idx);
            if (idx < st.route.waypoints.length - 1) {
              const copy = [...st.route.waypoints];
              [copy[idx], copy[idx + 1]] = [copy[idx + 1], copy[idx]];
              AppState.update({ route: { ...st.route, waypoints: copy } });
              await RouteEngine.computeRoute(copy);
              UIRenderer.renderWorkspace();
            }
          } else if (action === 'split-route') {
            await RouteEngine.splitRouteAt(Number(btn.dataset.idx));
            showToast('Route split into saved parts', 'success');
            UIRenderer.renderWorkspace();
          } else if (action === 'wp-remove') {
            await RouteEngine.removeWaypoint(Number(btn.dataset.idx));
            UIRenderer.renderWorkspace();
          } else if (action === 'save-vehicle') {
            MotorhomeEngine.updateVehicleProfile({
              name: document.getElementById('vpName')?.value,
              heightM: document.getElementById('vpHeight')?.value,
              lengthM: document.getElementById('vpLength')?.value,
              widthM: document.getElementById('vpWidth')?.value,
              weightKg: document.getElementById('vpWeight')?.value
            });
            showToast('Vehicle profile saved', 'success');
            UIRenderer.renderWorkspace();
          } else if (action === 'gpx-to-route') {
            const gpx = st.gpxItems.find((g) => g.id === btn.dataset.gpxId);
            if (gpx && gpx.points.length >= 2) {
              const wps = [
                { id: 'gpx_s', name: `${gpx.name} Start`, lat: gpx.points[0].lat, lon: gpx.points[0].lon, type: 'gpx' },
                { id: 'gpx_e', name: `${gpx.name} End`, lat: gpx.points[gpx.points.length - 1].lat, lon: gpx.points[gpx.points.length - 1].lon, type: 'gpx' }
              ];
              AppState.update({
                route: { ...st.route, name: gpx.name, waypoints: wps, geometry: gpx.points, distanceMeters: gpx.distanceMeters }
              });
              MapEngine.renderRoute(AppState.getState().route);
              showToast(`Loaded GPX "${gpx.name}" onto map`, 'success');
            }
          } else if (action === 'gpx-elevation') {
            const gpx = st.gpxItems.find((g) => g.id === btn.dataset.gpxId);
            if (gpx?.points?.length) {
              await ElevationEngine.buildProfileForCoords(gpx.points);
              UIRenderer.renderWorkspace();
            }
          } else if (action === 'save-gpx-col') {
            const gpx = st.gpxItems.find((g) => g.id === btn.dataset.gpxId);
            if (gpx && st.collections[0]) {
              await CollectionsEngine.addItemToCollection(st.collections[0].id, 'gpxFiles', { id: gpx.id, name: gpx.name, distanceMeters: gpx.distanceMeters });
              showToast(`Added GPX "${gpx.name}" to collection`, 'success');
              UIRenderer.renderWorkspace();
            }
          } else if (action === 'create-collection') {
            const nameVal = document.getElementById('newCollectionNameInput')?.value || 'New Collection';
            await CollectionsEngine.createCollection(nameVal);
            showToast(`Created collection "${nameVal}"`, 'success');
            UIRenderer.renderWorkspace();
          } else if (action === 'rename-col') {
            const nextName = prompt('New collection name:');
            if (nextName) {
              await CollectionsEngine.renameCollection(btn.dataset.colId, nextName);
              UIRenderer.renderWorkspace();
            }
          } else if (action === 'duplicate-col') {
            await CollectionsEngine.duplicateCollection(btn.dataset.colId);
            UIRenderer.renderWorkspace();
          } else if (action === 'delete-col') {
            await CollectionsEngine.deleteCollection(btn.dataset.colId);
            UIRenderer.renderWorkspace();
          } else if (action === 'share-col') {
            const col = st.collections.find((c) => c.id === btn.dataset.colId);
            if (col) {
              const summary = CollectionsEngine.buildShareSummary(col);
              navigator.clipboard?.writeText(summary).catch(() => {});
              showToast('Collection summary copied for sharing', 'success');
            }
          } else if (action === 'export-col') {
            const col = st.collections.find((c) => c.id === btn.dataset.colId);
            if (col) ExportEngine.downloadFile(`${col.name.toLowerCase().replace(/\W+/g, '_')}.json`, JSON.stringify(col, null, 2), 'application/json');
          } else if (action === 'export-gpx') ExportEngine.exportGpx();
          else if (action === 'export-kml') ExportEngine.exportKml();
          else if (action === 'export-geojson') ExportEngine.exportGeoJson();
          else if (action === 'export-txt') ExportEngine.exportTxt();
          else if (action === 'export-route-report') ExportEngine.exportRouteReport();
          else if (action === 'export-trip-report') ExportEngine.exportTripReport();
          else if (action === 'start-nav') {
            NavigationEngine.startNavigation(st.travelMode);
            UIRenderer.renderWorkspace();
          } else if (action === 'stop-nav') {
            const rec = await NavigationEngine.stopNavigationAndSaveRecording();
            if (rec) showToast(`Saved recorded GPX: ${rec.name}`, 'success');
            UIRenderer.renderWorkspace();
          } else if (action === 'sim-gps-step') {
            const steps = st.route.instructions || [];
            const nextIdx = Math.min(st.navigation.currentStepIndex + 1, Math.max(0, steps.length - 1));
            const target = steps[nextIdx] || st.route.waypoints[0];
            if (target) {
              await NavigationEngine.handlePositionUpdate(target.lat, target.lon, 10);
              MapEngine.setView(target.lat, target.lon, 14);
              UIRenderer.renderWorkspace();
            }
          } else if (action === 'download-offline-area') {
            const nameVal = document.getElementById('offlineAreaName')?.value;
            const radVal = Number(document.getElementById('offlineAreaRadius')?.value || 10);
            const c = MapEngine.getCenter();
            showToast(`Downloading offline area (${radVal}km)...`, 'info');
            const area = await OfflineEngine.downloadOfflineArea(nameVal, c.lat, c.lon, radVal);
            showToast(`Offline area ready (${area.cachedTiles} tiles, ${area.poisCount} POIs)`, 'success');
            UIRenderer.renderWorkspace();
          } else if (action === 'focus-offline') {
            MapEngine.setView(Number(btn.dataset.lat), Number(btn.dataset.lon), 12);
          } else if (action === 'delete-offline') {
            await OfflineEngine.deleteOfflineArea(btn.dataset.id);
            UIRenderer.renderWorkspace();
          } else if (action === 'set-highlight-cat') {
            AppState.update({ highlightCategory: btn.dataset.cat });
            AppState.persistPreferences();
            const prompt = AIEngine.generateHighlightPrompt(btn.dataset.cat, st.aiProvider);
            AppState.update({ lastGeneratedPrompt: prompt });
            UIRenderer.renderWorkspace();
          } else if (action === 'gen-highlight-prompt') {
            const prov = document.getElementById('aiHubProviderSelect')?.value || st.aiProvider;
            AppState.update({ aiProvider: prov });
            AppState.persistPreferences();
            const prompt = AIEngine.generateHighlightPrompt(st.highlightCategory, prov);
            AppState.update({ lastGeneratedPrompt: prompt });
            UIRenderer.renderWorkspace();
          } else if (action === 'gen-trip-prompt') {
            const prov = document.getElementById('aiHubProviderSelect')?.value || st.aiProvider;
            const prompt = AIEngine.generateTripPrompt(prov);
            AppState.update({ lastGeneratedPrompt: prompt });
            UIRenderer.renderWorkspace();
          } else if (action === 'gen-events-prompt') {
            const prov = document.getElementById('eventsProviderSelect')?.value || st.aiProvider;
            const win = document.getElementById('eventsWindowInput')?.value || 'upcoming weekend';
            AppState.update({ aiProvider: prov });
            AppState.persistPreferences();
            const prompt = AIEngine.generateEventsPrompt(prov, win);
            AppState.update({ lastGeneratedPrompt: prompt });
            UIRenderer.renderWorkspace();
          } else if (action === 'copy-prompt') {
            const txt = document.getElementById('promptOutputArea')?.value || st.lastGeneratedPrompt || '';
            if (txt) {
              navigator.clipboard?.writeText(txt).catch(() => {});
              showToast('Prompt copied to clipboard', 'success');
            }
          } else if (action === 'download-prompt') {
            const txt = document.getElementById('promptOutputArea')?.value || st.lastGeneratedPrompt || '';
            if (txt) ExportEngine.downloadFile('explorer_ai_prompt.txt', txt, 'text/plain;charset=utf-8');
          } else if (action === 'save-event-col') {
            const win = document.getElementById('eventsWindowInput')?.value || 'Event Idea';
            if (st.collections[0]) {
              await CollectionsEngine.addItemToCollection(st.collections[0].id, 'events', { title: win, addedAt: new Date().toISOString() });
              showToast(`Saved event note to "${st.collections[0].name}"`, 'success');
            }
          } else if (action === 'save-w3w-key') {
            const keyVal = document.getElementById('w3wApiKeyInput')?.value?.trim() || '';
            AppState.update({ w3wApiKey: keyVal });
            AppState.persistPreferences();
            showToast('What3Words key saved locally', 'success');
          } else if (action === 'coords-to-w3w') {
            try {
              const c = MapEngine.getCenter();
              const res = await What3WordsEngine.coordsToW3W(c.lat, c.lon);
              const box = document.getElementById('w3wResultBox');
              if (box) box.textContent = `///${res.words} (${res.nearestPlace || ''})`;
            } catch (err) {
              showToast(err.message, 'warn');
            }
          } else if (action === 'w3w-to-coords') {
            try {
              const wordsVal = document.getElementById('w3wWordsInput')?.value || '';
              const res = await What3WordsEngine.w3wToCoords(wordsVal);
              MapEngine.setView(res.lat, res.lon, 16);
              const box = document.getElementById('w3wResultBox');
              if (box) box.textContent = `${res.lat.toFixed(6)}, ${res.lon.toFixed(6)}`;
            } catch (err) {
              showToast(err.message, 'warn');
            }
          }
        });

        // File upload & select change delegation inside workspace
        document.getElementById('workspaceBody')?.addEventListener('change', async (e) => {
          if (e.target.id === 'gpxFileInput' && e.target.files?.[0]) {
            const file = e.target.files[0];
            try {
              const text = await file.text();
              const parsed = await GPXEngine.importGpxText(text, file.name);
              showToast(`Imported GPX: ${parsed.name} (${parsed.points.length} pts)`, 'success');
              if (parsed.points[0]) MapEngine.setView(parsed.points[0].lat, parsed.points[0].lon, 11);
              UIRenderer.renderWorkspace();
            } catch (err) {
              showToast(`GPX import error: ${err.message}`, 'error');
            }
          } else if (e.target.id === 'prefLangSelect') {
            const st = AppState.getState();
            AppState.update({ selectedLanguages: { ...st.selectedLanguages, preferred: e.target.value } });
            AppState.persistPreferences();
            MapEngine.renderPois(st.pois);
            UIRenderer.renderWorkspace();
          } else if (e.target.id === 'routeModeSelect') {
            AppState.update({ travelMode: e.target.value });
            AppState.persistPreferences();
            await RouteEngine.computeRoute();
            UIRenderer.renderWorkspace();
          }
        });

        // Online / Offline status tracking
        const updateNetPill = () => {
          const online = navigator.onLine;
          AppState.update({ online }, 'network:changed');
          const pill = document.getElementById('networkStatusPill');
          if (pill) {
            pill.textContent = online ? 'Online' : 'Offline';
            pill.className = `status-pill ${online ? 'online' : 'offline'}`;
          }
        };
        window.addEventListener('online', updateNetPill);
        window.addEventListener('offline', updateNetPill);
        updateNetPill();
      }

      async function boot() {
        MapEngine.init('map');
        bindEvents();

        try {
          await StorageEngine.openDb();
          await CollectionsEngine.loadAll();
          await OfflineEngine.loadOfflineAreas();
          const savedGpx = await StorageEngine.idbGetAll('gpx');
          if (savedGpx.length > 0) {
            AppState.update({ gpxItems: savedGpx });
            MapEngine.renderGpxTracks(savedGpx);
          }
          const savedPois = await StorageEngine.idbGetAll('pois');
          if (savedPois.length > 0) {
            AppState.update({ pois: savedPois });
            MapEngine.renderPois(savedPois);
          }
        } catch (err) {
          console.error('Storage initialisation error:', err);
        }

        ExplorerScaleEngine.applyScale(AppState.getState().explorerScaleKm, false);
        UIRenderer.renderWorkspace();
        runWeatherFetch(false).catch(() => {});

        if ('serviceWorker' in navigator) {
          navigator.serviceWorker.register('./service-worker.js').catch((err) => {
            console.warn('Service worker registration skipped/failed:', err);
          });
        }
      }

      return { boot };
    })();

    document.addEventListener('DOMContentLoaded', () => {
      AppController.boot();
    });
  </script>
</body>
</html>
